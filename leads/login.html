<!doctype html>
<!--
  Open House Leads — login surface (standalone)
  STATUS: connection-ready seam, v0.18.20 (introduced v0.18.6 as a static shell;
  this ship wires the real handler with a stubbed fetch). Built ahead of the
  backend cycle per the auth decision (V1_5_BACKEND_BRIEF §1 + its §1 addendum,
  ADR-0029) and the "login ships as its own file, not folded into index.html"
  note. This page does NOT authenticate yet — no auth endpoint exists. The
  login(email, password) function below is the REAL handler: the fetch to
  /api/auth/login is present but commented/stubbed, with the success / 401 / 429
  branches already wired to showNotice and a button loading state. On submit it
  currently shows a placeholder message. BACKEND CONNECTION LATER = uncomment the
  fetch block + remove the placeholder; nothing else changes. The /api/me boot
  gate and 401 interceptor live in index.html and land with the backend cycle —
  NOT here (they would break the demo with no backend to answer).
  Styling mirrors the locked chrome: DM Sans, the token palette, the gradient
  brand mark, panel/border-strong fields with the blue focus ring.
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open House Leads — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --frame:          #F5F5F7;
    --panel:          #FFFFFF;
    --surface-tint:   #F4F4F6;
    --border-subtle:  #ECECEF;
    --border-strong:  #D8D8DE;
    --text-primary:   #1C1C1F;
    --text-body:      #3D3A35;
    --text-secondary: #6E6B64;
    --text-muted:     #9B9892;
    --accent-blue:    #5B6DFF;
    --accent-red:     #FF6B6B;
    --red-soft:       #FDE7E7;
    --r-sm:   10px;
    --r-md:   14px;
    --r-lg:   16px;
    --r-pill: 999px;
    --shadow-shell: 0 8px 32px rgba(0,0,0,0.04);
    --font-sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--frame);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* subtle depth so it isn't a flat slab */
    background-image:
      radial-gradient(60% 50% at 50% 0%, rgba(91,109,255,0.05) 0%, rgba(91,109,255,0) 70%);
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border-subtle);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-shell);
    padding: 32px 30px 28px;
    animation: rise 360ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Brand mark — identical to the app sidebar */
  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 26px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, #5B6DFF 0%, #9B7CFF 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px; padding: 7px;
    flex-shrink: 0;
  }
  .brand-mark span { background: rgba(255,255,255,0.9); border-radius: 2px; }
  .brand-mark span:nth-child(2) { background: rgba(255,255,255,0.6); }
  .brand-mark span:nth-child(3) { background: rgba(255,255,255,0.7); }
  .brand-mark span:nth-child(4) { background: rgba(255,255,255,0.95); }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -0.2px; }

  .title { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 24px; }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--text-body);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-sm);
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--text-primary);
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  .field input::placeholder { color: var(--text-muted); }
  .field input:focus {
    outline: 0;
    border-color: var(--text-secondary);
    box-shadow: 0 0 0 3px rgba(91, 109, 255, 0.08);
  }

  .btn-primary {
    width: 100%;
    height: 44px;
    margin-top: 8px;
    border: 0;
    border-radius: var(--r-sm);
    background: var(--accent-blue);
    color: #fff;
    font-family: var(--font-sans);
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: filter 120ms ease, transform 80ms ease;
  }
  .btn-primary:hover { filter: brightness(1.05); }
  .btn-primary:active { transform: translateY(1px); }

  .meta-row {
    margin-top: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .notice {
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    background: var(--surface-tint);
    color: var(--text-secondary);
    font-size: 12.5px;
    line-height: 1.45;
    display: none;
  }
  .notice.show { display: block; }
  .notice.error { background: var(--red-soft); color: #B23B3B; }
</style>
</head>
<body>
  <main class="login-card" role="main">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <span class="brand-name">Open House</span>
    </div>

    <h1 class="title">Connexion</h1>
    <p class="subtitle">Accédez à votre espace de gestion des leads.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" autocomplete="username"
               placeholder="vous@agence.fr" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Se connecter</button>
    </form>

    <div class="notice" id="notice"></div>

    <div class="meta-row">Open House Leads</div>
  </main>

  <script>
    // Connection-ready seam. No auth endpoint exists yet — see the file header.
    // login(email, password) below IS the real handler: the fetch to
    // /api/auth/login is present but commented out. To go live: uncomment the
    // fetch block and DELETE the placeholder line marked below. Nothing else changes.
    const form = document.getElementById("login-form");
    const notice = document.getElementById("notice");
    const submitBtn = form.querySelector(".btn-primary");

    function showNotice(msg, isError) {
      notice.textContent = msg;
      notice.className = "notice show" + (isError ? " error" : "");
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? "Connexion…" : "Se connecter";
    }

    // The real handler. When the Railway endpoint lands, uncomment the fetch
    // block and remove the placeholder line. Branches are already wired.
    async function login(email, password) {
      setLoading(true);
      try {
        // ---- BACKEND CONNECTION: uncomment this block to go live ----
        // const res = await fetch("/api/auth/login", {
        //   method: "POST",
        //   credentials: "include",
        //   headers: { "Content-Type": "application/json" },
        //   body: JSON.stringify({ email, password })
        // });
        // if (res.ok) {
        //   window.location = "index.html";
        //   return;
        // }
        // if (res.status === 429) {
        //   showNotice("Trop de tentatives, réessayez dans une minute.", true);
        //   return;
        // }
        // const data = await res.json().catch(() => ({}));
        // showNotice(data.error || "E-mail ou mot de passe incorrect.", true);
        // -------------------------------------------------------------

        // PLACEHOLDER (remove when the fetch block above is uncommented):
        showNotice("Connexion non encore active — l'authentification sera branchée avec le backend.", false);
      } catch (err) {
        showNotice("Connexion impossible pour le moment. Réessayez.", true);
      } finally {
        setLoading(false);
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        showNotice("Veuillez renseigner votre e-mail et votre mot de passe.", true);
        return;
      }
      login(email, password);
    });
  </script>
</body>
</html>
