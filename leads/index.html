       secondary color — reads as "checked off."
     .activity-badge--pending: action not yet taken. Dashed border +
       muted-er color — reads as "yet to do, not yet a signal."
     Slightly smaller than v0.10.1 (20px vs 24px) to reduce visual
     weight in the card's right column. */
  .activity-badge {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    flex-shrink: 0;
  }
  .activity-badge--done {
    border: 1px solid var(--text-secondary);
    color: var(--text-secondary);
  }
  .activity-badge--pending {
    border: 1px dashed var(--border-strong);
    color: var(--text-muted);
  }
  .activity-badge svg {
    width: 11px;
    height: 11px;
    stroke-width: 2;
  }

  /* Select-mode checkbox on the card — slides in on the left (before
     avatar in DOM order). Same visual as the table row's .leads-checkbox. */
  .leads-card-checkbox {
    width: 20px;
    height: 20px;
    border-radius: 5px;
    border: 1.5px solid var(--border-strong);
    background: var(--panel);
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .leads-card-checkbox--on {
    background: var(--text-primary);
    border-color: var(--text-primary);
  }
  .leads-card-checkbox--on svg {
    width: 12px;
    height: 12px;
    stroke: white;
    stroke-width: 2.5;
  }

  /* ═══════════════════════════════════════════════════════════════
     LEADS — toggle + type-accent surface cues.
     Everything type-aware reads from --type-accent / --type-accent-bg /
     --type-accent-strong, which are set on the .leads mode-* root
     class. Flipping the toggle re-palettes the whole surface in one
     place. The stage KPI cards, table card header icon, and toggle
     tabs all pick up these variables.
     ═══════════════════════════════════════════════════════════════ */
  .leads {
    --type-accent:        var(--accent-blue);
    --type-accent-bg:     var(--blue-soft);
    --type-accent-strong: var(--accent-blue);
  }
  .leads.mode-seller {
    --type-accent:        #8C5A08;              /* amber-deep (readable) */
    --type-accent-bg:     var(--amber-soft);
    --type-accent-strong: var(--accent-amber);  /* vibrant for the strip */
  }

  /* v0.10.3 — §10b toggle redesign (V11).
     Replaces: 4px top band, pill-shaped segmented toggle, and
     context-chip meta row. v0.18.15 — the page-top chrome is the control band
     (renderLeadsBand): the buyer/seller pill on the left, Période + Campagne on
     the right. v0.18.16 — the old "Leads · Acquéreurs" H1 (.leads-title) was
     dropped; the band is now the top of the page. Below it:
       1. .leads-mode-card   — slim split card, icon+label per half (in the band)
       2. .leads-meta-row    — context chip + "Mis à jour" timestamp
     The --type-accent CSS custom properties (set on .leads root) are
     unchanged — KPI active card + untouched-card left bar continue
     reading from them. */

  /* Split-card toggle — slim, natural width, left-aligned.
     Shorter than a KPI card (no count, just icon + label). Single
     card visually, two halves separated by a 1px vertical divider.
     Active half is filled with type-accent-bg; inactive half stays
     white with muted content. */
  /* v0.18.15 — pill base rules de-scoped from .leads to the band contexts
     (.leads-band on Leads, .dash-head on the Dashboard) so the relocated pill
     is styled identically on both pages. The Dashboard pill is inert (item B,
     intent 3) but shares this exact treatment. Height/radius/border are tuned
     to the dash-filter <select> family (item 2) so the three controls read as one. */
  .leads-band .leads-mode-card,
  .dash-head .leads-mode-card {
    display: inline-grid;
    grid-template-columns: 1fr auto 1fr;
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--r-sm);
    overflow: hidden;
    box-shadow: var(--shadow-xs);
  }
  .leads-band .leads-mode-half,
  .dash-head .leads-mode-half {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    background: transparent;
    border: 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: -0.005em;
    cursor: pointer;
    white-space: nowrap;
    transition: background 120ms ease, color 120ms ease;
    min-width: 150px;  /* prevent the halves from collapsing below icon+label */
  }
  .leads-band .leads-mode-half:hover:not([aria-selected="true"]),
  .dash-head .leads-mode-half:hover:not([aria-selected="true"]) {
    background: var(--surface-tint);
    color: var(--text-primary);
  }
  /* Inert variant (Dashboard): the buyer half renders as a non-actioned element,
     so no hover affordance — it's a consistency placeholder, not a control. */
  .dash-head .leads-mode-half--inert,
  .dash-head .leads-mode-half--inert:hover { cursor: default; background: transparent; }
  .leads-band .leads-mode-half-ico,
  .dash-head .leads-mode-half-ico {
    width: 22px;
    height: 22px;
    border-radius: 999px;
    background: var(--surface-tint);
    display: grid;
    place-items: center;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: background 120ms ease, color 120ms ease;
  }
  .leads-band .leads-mode-half-ico svg,
  .dash-head .leads-mode-half-ico svg {
    width: 12px;
    height: 12px;
    stroke-width: 2;
  }
  .leads-band .leads-mode-half[aria-selected="true"],
  .dash-head .leads-mode-half[aria-selected="true"] {
    background: var(--type-accent-bg);
    color: var(--type-accent);
    font-weight: 600;
  }
  .leads-band .leads-mode-half[aria-selected="true"] .leads-mode-half-ico,
  .dash-head .leads-mode-half[aria-selected="true"] .leads-mode-half-ico {
    background: var(--type-accent-strong);
    color: var(--panel);
  }
  /* V1 disabled Vendeurs half — visible but inert, with a "Bientôt" tag. */
  .leads-mode-half--disabled {
    opacity: 0.45;
    cursor: not-allowed;
    position: relative;
  }
  .leads-mode-half--disabled:hover { background: transparent; }
  .leads-mode-half-soon {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-transform: uppercase;
    color: var(--text-muted);
    border: 1px solid var(--border-subtle);
    border-radius: 5px;
    padding: 1px 5px;
    margin-left: 4px;
  }
  .leads-mode-divider {
    width: 1px;
    background: var(--border-subtle);
    align-self: stretch;
  }

/* v0.18 — push a Vue rapide chip and navigate to the Leads page (ADR-0014).
   Carries the dashboard's current Campagne as a second chip so dashboard scope
   travels with the tile click. Replaces any existing chip of the same kind
   (at most one of each). Resets the panel-native dims (filterTab / Score / Date)
   so the landing set is exactly the chip's subset — the user composes panel
   constraints on top from there. */
function applyVueRapide(chip) {
  const chips = state.vueRapide.filter(v => v.kind !== chip.kind && v.kind !== "campagne");
  chips.push(chip);
  // Carry the dashboard Campagne over (unless it's the demo / "all").
  if (state.dashCampagne && state.dashCampagne !== "__demo_non_paris__") {
    chips.push({ kind: "campagne", label: `Campagne : ${state.dashCampagne}`, value: state.dashCampagne });
  }
  setState({
    route: "leads",
    leadType: "buyer",
    filterTab: "all",
    filters: { score: [], budget: [], secteur: [], timing: [] },
    leadsSearch: "",
    vueRapide: chips,
    leadsPage: 1,
    drawer: null,
  });
}

/* ═══════════════════════════════════════════════════════════════
   META FORM RESPONSES (v0.12.0) — the verbatim Lead Ads form record.

   Greg brief Update 26-05: keep every answer the lead gave on the Meta
   form and show it in the drawer so an agent never reopens Meta. The
   drawer "Réponses Meta" tab loops over `lead.formResponses`, an array of
   { question, answer } pairs in form order — the SAME shape the V1 backend
   repository layer (ADR-0001) will produce by mapping Meta's webhook
   `field_data` ([{ name, values }]) → { question, answer }. So the swap
   from dummy → live data is a data-source change only; no render change.

   The normalized fields the table indexes off (budget tag, short secteur
   label, timeline, score) are derived copies and stay as-is; here we
   reconstruct the RAW answer wording the lead actually saw on the form
   (full secteur with arrondissements, "1M à 2M" not the "1M–2M" tag).
   ═══════════════════════════════════════════════════════════════ */

// Short table label → full Meta answer wording (with arrondissements).
const SECTEUR_FULL = {
  "Rive gauche":        "Rive gauche (5e, 6e, 7e)",
  "Rive droite centre": "Rive droite centre (1er, 2e, 3e, 4e)",
  "Rive droite ouest":  "Rive droite ouest (8e, 16e, 17e)",
};
// Budget tag (table) → raw Meta form answer wording.
const BUDGET_META = {
  "Moins de 1M": "Moins de 1M",
  "1M–2M":       "1M à 2M",
  "2M–4M":       "2M à 4M",
  "4M+":         "4M+",
};

// Build the verbatim Q&A record from a buyer lead's normalized fields, in
// Meta form order. Mirrors what the repository layer returns from the API.
function metaResponsesFor(lead) {
  const feats = (lead.features && lead.features.length)
    ? lead.features.join(", ") : "—";
  return [
    { question: "Projet d'acquisition",         answer: lead.projectType || "—" },
    { question: "Secteur recherché",            answer: SECTEUR_FULL[lead.secteur] || lead.secteur || "—" },
    { question: "Caractéristiques spécifiques", answer: feats },
    { question: "Timing projet",                answer: lead.timeline || "—" },
    { question: "Budget",                       answer: BUDGET_META[lead.budget] || lead.budget || "—" },
    { question: "Souhaite être contacté",       answer: lead.contactPreference || "—" },
  ];
}

// Seed dummy buyer leads with the API-shaped record. (Seller leads use a
// different form; they stay dormant in V1 — leadType is locked to "buyer".)
state.leads.forEach(l => {
  if (l.type === "buyer") l.formResponses = metaResponsesFor(l);
});

/* ═══════════════════════════════════════════════════════════════
   LEAD DATA HELPERS — pure lookups, no DOM. Used by the drawer header
   and by every Leads-page primitive that touches stage or type data.
   Kept here (between state and renderers) so any renderer can use them.
   ═══════════════════════════════════════════════════════════════ */

/* "buyer" → "Acquéreur", "seller" → "Vendeur". Falls back to the raw key. */
function typeLabel(typeKey) {
  return { buyer: "Acquéreur", seller: "Vendeur" }[typeKey] || typeKey;
}

/* Look up a stage label from the agency pipeline. "lost" is a terminal state
   outside the pipeline array — renders as "Perdu". Unknown ids fall back to
   the id itself so missing data is visible rather than silently blank. */
function stageLabel(typeKey, stageId) {
  if (stageId === "lost") return "Perdu";
  const pipeline = state.agency.pipeline[typeKey] || [];
  const stage = pipeline.find(s => s.id === stageId);
  return stage ? stage.label : stageId;
}

/* Stage id → { bg, fg } pill colors. Values chosen to match DESIGN_SPEC §8
   status semantics (new = blue, progress = violet, qualified = green,
   converted = dark green, terminal-fail = red, amber for offer/mandate-signed).
   Buyer and seller stage ids share colors where the semantic matches
   ("contacted" same in both, "converted" ↔ "sold" both dark green, etc.).
   If the status CSS tokens get formalized in :root later, swap hex for var(). */
function stageColors(stageId) {
  // bg   = soft tint (icon badge on default card, card surface on active)
  // fg   = mid-saturation color (icon stroke, active-state label/accent)
  // deep = dark variant for bold text on the tinted surface (active card's count)
  return {
    // Buyer pipeline (v0.18.9 — 31-05 redirect: 3 forward stages, ADR-0019)
    nouveau:         { bg: "#EEEEF1", fg: "#8A8780", deep: "#4A4843" },  // grey — never treated (Greg brief Update 26-05 (2))
    a_contacter:     { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber — needs a call
    contacte:        { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet — in motion
    // visite_prevue — DORMANT in V1 (dropped from the funnel at v0.18.9, ADR-0019,
    // reverses ADR-0005). Colour kept so any un-migrated data still renders.
    visite_prevue:   { bg: "#E4F4E9", fg: "#2F9D6F", deep: "#15653E" },  // green — progressing
    // Legacy buyer ids (dormant — kept so any un-migrated data still colours)
    to_process:      { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue — fresh
    contacted:       { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet — in motion
    qualified:       { bg: "#E4F4E9", fg: "#2F9D6F", deep: "#15653E" },  // green — qualified
    visit_planned:   { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue — progressing
    offer_made:      { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber — committed
    converted:       { bg: "#D8EEDF", fg: "#1F7D54", deep: "#0D5034" },  // dark green — won
    // Seller pipeline (shared where semantically equivalent)
    estimation_sent: { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet
    appointment:     { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue
    mandate_signed:  { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber
    sold:            { bg: "#D8EEDF", fg: "#1F7D54", deep: "#0D5034" },  // dark green
    // Terminal
    lost:            { bg: "#FDE7E7", fg: "#C44343", deep: "#7A1F1F" },  // red
  }[stageId] || { bg: "#F4F4F6", fg: "#6E6B64", deep: "#3B3A35" };       // fallback = neutral
}

/* Price field differs by type — buyers declare a budget range, sellers
   state an expected price. Both are pre-formatted strings with € suffix. */
function leadPrice(lead) {
  return lead.type === "seller" ? lead.expectedPrice : lead.budget;
}

/* Timeline likewise differs — buyer.timeline is purchase horizon,
   seller.sellingTimeline is listing horizon. */
function leadTimeline(lead) {
  return lead.type === "seller" ? lead.sellingTimeline : lead.timeline;
}

/* v0.18.14 (ADR-0027) — lead lifecycle, tri-state: active | archived | deleted.
   Extends the v0.18.11 archivage model (ADR-0022) with a second excluded state.
   A lead carries archived (bool) + archivedAt (ISO|null) AND deleted (bool) +
   deletedAt (ISO|null); all default at READ time so the seed rows stay untouched
   (absent = not archived, not deleted). Three predicates, one source of truth:
     - isActive(lead)   → shown in the Leads list + every active counter
     - isArchived(lead) → shown in Archives ONLY (archived but not deleted)
     - isDeleted(lead)  → shown in Corbeille ONLY
   No lead is ever in two buckets. Every ACTIVE counter/list filters isActive;
   the Archives view filters isArchived; the Corbeille view filters isDeleted.
   Soft-delete (Supprimer / bulk-delete) sets deleted; the ONLY hard removal from
   state.leads is purge-lead ("Supprimer définitivement") in the Corbeille. */
function isArchived(lead) { return !!lead.archived && !lead.deleted; }
function isDeleted(lead)  { return !!lead.deleted; }
function isActive(lead)   { return !lead.archived && !lead.deleted; }

/* Write-side companion to the read predicates above. The single seam every
   lead-field mutation flows through (ADR-0016: parses on read, serialises on
   write — one repository write contract). Takes and returns a domain lead
   object; does NOT call setState/render (the call site owns its render
   decision — notes deliberately mutates without re-render to keep focus). */
function updateLead(lead, changes) {
  if (!lead) return;
  Object.assign(lead, changes);
  // SHIP 2 (ADR-0016): repository.persist(lead) goes HERE — the single write seam.
  return lead;
}

/* French formatter for the ISO createdAt field. Stored ISO (sortable),
   displayed French. When the backend lands and real timestamps come
   in, this is the single function to upgrade (moment/intl).

   v0.10.4 — Path A shipped. createdAt is now a full ISO datetime
   string ("2026-04-18T10:15:00Z" in state). The formatter gained a
   `showTime` opt + a `longMonth` opt so the mobile card can render
   "06 avril · à 16h35" (full month name + middle-dot separator +
   French time style `16h35`) while the desktop table keeps its
   terse "18 avr. 2026" (abbreviated month + year, no time).

   Options:
     - showYear   (default true)   append " 2026"
     - showTime   (default false)  append " · à 16h35"
     - longMonth  (default false)  use "avril" instead of "avr."
   Non-ISO or malformed input falls through as-is so bugs are visible.
*/
const MONTHS_FR_SHORT = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
                         "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const MONTHS_FR_LONG  = ["janvier", "février", "mars", "avril", "mai", "juin",
                         "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function formatLeadDate(iso, opts) {
  if (!iso) return "—";
  // Accept both date-only "YYYY-MM-DD" and full ISO "YYYY-MM-DDTHH:MM:SSZ".
  // Date portion is always the first 10 chars; the T marker splits off time.
  const datePart = iso.slice(0, 10);
  const [y, m, d] = datePart.split("-").map(Number);
  if (!y || !m || !d) return iso;  // malformed — show raw
  const showYear   = !opts || opts.showYear !== false;
  const showTime   = opts && opts.showTime === true;
  const longMonth  = opts && opts.longMonth === true;
  const monthName  = (longMonth ? MONTHS_FR_LONG : MONTHS_FR_SHORT)[m - 1];
  let out = `${String(d).padStart(2, "0")} ${monthName}`;
  if (showYear) out += ` ${y}`;
  if (showTime && iso.length >= 16 && iso.charAt(10) === "T") {
    // Extract HH:MM from the ISO; render as French-style "16h35".
    const hh = iso.slice(11, 13);
    const mm = iso.slice(14, 16);
    out += ` · à ${hh}h${mm}`;
  }
  return out;
}

/* V1 human date for the table Date column: Aujourd'hui / Hier / Il y a N
   jours for the last week, terse "12 mai" beyond that. Relative to runtime
   (see daysAgoISO on the dummy data). */
function formatLeadDateHuman(iso) {
  if (!iso) return "—";
  const then = new Date(iso);
  if (isNaN(then.getTime())) return iso;
  const now = new Date();
  const d0 = new Date(now.getFullYear(),  now.getMonth(),  now.getDate());
  const d1 = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const days = Math.round((d0 - d1) / 86400000);
  if (days <= 0)  return "Aujourd'hui";
  if (days === 1) return "Hier";
  if (days < 7)   return `Il y a ${days} jours`;
  return formatLeadDate(iso, { showYear: false });
}

/* Extract numeric budget for sort. budget/expectedPrice are formatted strings
   like "1 200 000 €" — strip non-digits and parse. Missing values sort last
   (returned Infinity in asc, -Infinity conceptually in desc via sign flip).
   Returns 0 if nothing numeric (unset). */
function leadPriceNumeric(lead) {
  const raw = lead.type === "seller" ? lead.expectedPrice : lead.budget;
  if (!raw) return 0;
  const digits = String(raw).replace(/\D/g, "");
  return digits ? parseInt(digits, 10) : 0;
}

/* score sort order: hot > warm > cold (decreasing urgency).
   Unknown scores sort last. */
const SCORE_ORDER = { hot: 3, warm: 2, cold: 1 };
function leadScoreOrder(lead) { return SCORE_ORDER[lead.score] || 0; }
// v0.13.0 — forward order of the 4 buyer stages, + Perdu last. Drives the
// Statut column sort. Stage ids that aren't in the funnel fall back to 0.
const STATUS_ORDER = { nouveau: 1, a_contacter: 2, contacte: 3, lost: 5 };
function leadStatusOrder(lead) { return STATUS_ORDER[lead.status] || 0; }

/* Agent name lookup for sort. Unassigned leads sort as empty string (top in
   asc, bottom in desc). */
function leadAgentName(lead) {
  if (lead.assignedAgentId == null) return "";
  const agent = state.team.find(t => t.id === lead.assignedAgentId);
  return agent ? agent.name : "";
}

/* Sort comparator factory. Returns a function (a, b) => number per column.
   Direction applied by the caller (multiply result by -1 for desc). */
function leadComparator(column) {
  switch (column) {
    case "name":   return (a, b) => a.name.localeCompare(b.name,   "fr");
    case "budget": return (a, b) => leadPriceNumeric(a) - leadPriceNumeric(b);
    case "secteur":return (a, b) => (a.secteur || "").localeCompare(b.secteur || "", "fr");
    case "timing": return (a, b) => (TIMING_ORDER[leadTimeline(a)] || 0) - (TIMING_ORDER[leadTimeline(b)] || 0);
    case "zone":   return (a, b) => (a.zone || "").localeCompare(b.zone || "", "fr");
    case "score":  return (a, b) => leadScoreOrder(a) - leadScoreOrder(b);
    case "statut": return (a, b) => leadStatusOrder(a) - leadStatusOrder(b);
    case "agent":  return (a, b) => leadAgentName(a).localeCompare(leadAgentName(b), "fr");
    case "date":   return (a, b) => (a.createdAt || "").localeCompare(b.createdAt || "");  // ISO string compare = chronological
    default:       return (a, b) => a.id - b.id;
  }
}

function renderBrand() {
  return `
    <div class="brand">
      <div class="brand-left">
        <div class="brand-mark" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <span class="brand-name">Open House</span>
      </div>
    </div>
  `;
}

function renderAgencyAvatar(agency) {
  if (agency.logo) {
    return `<div class="agency-avatar" data-variant="logo"><img src="${agency.logo}" alt="${agency.name}" onerror="this.parentElement.removeAttribute('data-variant'); this.parentElement.innerHTML='${agency.initials}'"></div>`;
  }
  return `<div class="agency-avatar">${agency.initials}</div>`;
}

function renderAgencySwitcher(agency) {
  const currentAccount = agency.metaAccounts.find(a => a.id === agency.currentMetaAccountId);
  const accountLabel = currentAccount
    ? `${icon.home()}${currentAccount.label}`
    : (agency.metaAccounts[0] ? `${icon.home()}${agency.metaAccounts[0].label}` : "");
  const isOpen = state.agencySwitcherOpen;
  return `
    <div class="agency-switcher-wrap">
      <div class="agency-switcher" data-action="toggle-agency-switcher" role="button" tabindex="0" aria-expanded="${isOpen}">
        ${renderAgencyAvatar(agency)}
        <div class="agency-text">
          <div class="agency-name">${agency.name}</div>
          <div class="agency-account">${accountLabel}</div>
        </div>
        ${icon.chevronDown()}
      </div>
      ${isOpen ? renderAgencyMenu(agency) : ""}
    </div>
  `;
}

function renderAgencyMenu(agency) {
  const items = agency.metaAccounts.map(a => {
    const active = a.id === agency.currentMetaAccountId;
    return `
      <div class="agency-menu-item" data-action="select-meta-account" data-meta-account-id="${a.id}" data-active="${active}" role="menuitem">
        ${icon.home()}
        <span>${a.label}</span>
        ${active ? icon.check() : ""}
      </div>
    `;
  }).join("");
  return `
    <div class="agency-menu" role="menu">
      <div class="agency-menu-label">Compte Meta actif</div>
      ${items}
    </div>
  `;
}

function buyerLeadCount() {
  // V1 shows buyer leads only; badge reflects the live count (was hardcoded 24).
  // v0.18.11 (ADR-0022): archived leads aren't in the Leads list, so they're
  // not in the badge either.
  return state.leads.filter(l => l.type === "buyer" && isActive(l)).length;
}

function renderNavItem(item, active, sub) {
  // v0.11.4 — soon items (V2 pages) are inert: no data-route, not focusable,
  // greyed, with a "Bientôt" tag. Live items keep normal button behaviour.
  // v0.18.14 (ADR-0027) — sub:true renders an indented sub-item (Corbeille under
  // Archives); same nav classes + data-route click path, just a modifier class.
  if (item.soon) {
    return `
      <li>
        <div class="nav-item nav-item--soon" aria-disabled="true" title="Bientôt disponible">
          ${icon[item.icon]()}
          <span class="nav-item-label">${item.label}</span>
          <span class="nav-item-soon">Bientôt</span>
        </div>
      </li>
    `;
  }
  const badge = item.id === "leads"
    ? `<span class="nav-item-badge">${buyerLeadCount()}</span>`
    : (item.badge ? `<span class="nav-item-badge">${item.badge}</span>` : "");
  return `
    <li>
      <div class="nav-item${sub ? " nav-item--sub" : ""}" data-active="${active}" data-route="${item.id}" role="button" tabindex="0">
        ${icon[item.icon]()}
        <span class="nav-item-label">${item.label}</span>
        ${badge}
      </div>
    </li>
  `;
}

function renderNavGroup(group, activeRoute) {
  // v0.18.14 (ADR-0027) — Corbeille is NOT a flat nav peer; it reveals as an
  // indented sub-item directly under Archives, and ONLY while the active route is
  // archives or corbeille. Built by walking the group items and injecting the
  // sub-item right after the archives entry when the reveal condition holds.
  const showCorbeille = activeRoute === "archives" || activeRoute === "corbeille";
  const corbeilleItem = { id: "corbeille", label: "Corbeille", icon: "trash" };
  const itemsHtml = group.items.map(it => {
    const self = renderNavItem(it, it.id === activeRoute);
    if (it.id === "archives" && showCorbeille) {
      return self + renderNavItem(corbeilleItem, activeRoute === "corbeille", true);
    }
    return self;
  }).join("");
  return `
    <div class="nav-group">
      <div class="nav-section-label">${group.label}</div>
      <ul class="nav-list">
        ${itemsHtml}
      </ul>
    </div>
  `;
}

/**
 * Button primitive. Every clickable text-action uses this.
 * Icon-only buttons use `.icon-btn` directly (topbar plus/bell).
 *
 *   variant: "default" | "primary" | "ghost" | "danger"   (default: "default")
 *   size:    "sm" | "md" | "lg"                           (default: "md")
 *   block:   boolean — full-width                         (default: false)
 *   icon:    SVG string (from icon.*()) placed before label
 *   label:   button text
 *   action:  data-action value to dispatch on click
 *   disabled: boolean
 *   extra:   additional class names (rare)
 *
 * DORMANT in V1 (since v0.11.2): no current call sites — the drawer footer
 * (its last consumer) was removed when the Centre d'action moved its actions
 * into the Messages rapides tab. Kept as the generic button primitive for V2
 * forms / re-enabled surfaces. See V1_SCOPE §8 (V2 = re-enable, not rebuild).
 */
function renderButton({ variant = "default", size = "md", block = false, icon = "", label = "", action = "", disabled = false, extra = "" } = {}) {
  const classes = [
    "btn",
    variant !== "default" && `btn--${variant}`,
    size !== "md" && `btn--${size}`,
    block && "btn--block",
    extra,
  ].filter(Boolean).join(" ");
  const attrs = [
    `class="${classes}"`,
    action ? `data-action="${action}"` : "",
    disabled ? `disabled aria-disabled="true"` : "",
  ].filter(Boolean).join(" ");
  return `<button ${attrs}>${icon}${label ? `<span>${label}</span>` : ""}</button>`;
}

/* ───── Leads content (Step 2 Layer 1) ─────
   Route "leads" renders the Leads page. Every primitive below is
   data-driven off state + the helpers defined earlier (stageLabel,
   stageColors, typeLabel, leadPrice, leadTimeline). */

/* Single source of truth for the filtered view. Returns the visible leads
   plus the counts used by the context chip, pipeline bar, and filter tabs.

   Counts discipline:
   - typeCounts    = raw totals per type, ignoring search. Powers the
                     context chip so "10 acquéreurs actifs / 3 vendeurs
                     actifs" reads the honest volume even mid-search.
   - stageCounts   = per-stage counts within current type + search. Powers
                     both the pipeline bar and the filter tabs. Counts stay
                     stable as the user clicks between tabs.
   - lostCount     = same scope as stageCounts but for the terminal "lost".
   - totalFiltered = type + search filtered total; shown in "Tous" tab. */
function computeLeadsView() {
  const type     = state.leadType;
  const pipeline = state.agency.pipeline[type] || [];
  const search   = state.leadsSearch.trim().toLowerCase();

  // Raw per-type totals (ignore search — context chip must read true volume).
  // v0.18.11 (ADR-0022): archived leads are excluded everywhere on the Leads
  // surface — they live only in the Archives view. So the context-chip totals
  // exclude them too, matching the list below.
  const typeCounts = {
    buyer:  state.leads.filter(l => l.type === "buyer"  && isActive(l)).length,
    seller: state.leads.filter(l => l.type === "seller" && isActive(l)).length,
  };

  // Apply type + search to get the set all tab/pipeline counts are based on.
  // Non-active excluded first (ADR-0027: archived AND deleted) — the single
  // Leads-list choke point, so pagination, filters, export, and stage counts
  // all inherit the exclusion (CSV export reads computeLeadsView, so it too).
  const baseFiltered = state.leads.filter(l => {
    if (l.type !== type) return false;
    if (!isActive(l)) return false;   // v0.18.14 — excludes archived AND deleted (ADR-0027)
    if (!search) return true;
    const hay = `${l.name} ${l.email} ${l.zone || ""}`.toLowerCase();
    return hay.includes(search);
  });

  // Count per stage id, plus terminal "lost".
  const stageCounts = {};
  pipeline.forEach(s => { stageCounts[s.id] = 0; });
  let lostCount = 0;
  baseFiltered.forEach(l => {
    if (l.status === "lost") lostCount++;
    else if (stageCounts[l.status] !== undefined) stageCounts[l.status]++;
  });

  // Apply filter tab on top of the base set.
  // Layer 2 note: "all" excludes lost. As of v0.13.0 the Statut column is
  // back, so a lost lead now carries a visible "Perdu" pill when shown.
  // Lost leads are surfaced via the "lost" filter path (a future Filter
  // popover "Afficher les perdus" toggle sets filterTab to "lost"); the
  // code path is kept alive here so that ships without a refactor.
  //
  // v0.9.2 — two new cross-cutting filter values (not stage ids):
  //   "today"      → leads where createdAt === today (any stage, excludes lost)
  //   "unassigned" → leads where assignedAgentId == null (any stage, excludes lost)
  // These filter the visible set just like stage filters, but match by
  // different criteria. computeCrossCuttingCards (used by renderStageCards)
  // computes their counts against leadsInType so the counts don't shift
  // when the user flips between filter tabs.
  const todayIso = new Date().toISOString().slice(0, 10);
  const visible = baseFiltered.filter(l => {
    if (state.filterTab === "all")        return l.status !== "lost";
    if (state.filterTab === "lost")       return l.status === "lost";
    if (state.filterTab === "today")      return l.status !== "lost" && l.createdAt && l.createdAt.slice(0, 10) === todayIso;
    // "unassigned" — DORMANT in V1 (v0.15): the "Non assignés" quick-filter
    // card was removed (brief drops "Non assigné"); no UI sets this value.
    // Kept so any external/legacy state still resolves. assignedAgentId is V2.
    if (state.filterTab === "unassigned") return l.status !== "lost" && l.assignedAgentId == null;
    return l.status === state.filterTab;
  });

  // v0.15 — Filters panel dimensions (Score · Date), layered on top of the
  // filterTab + search base. Statut filtering IS filterTab (shared with the
  // stage cards — one source of truth), so it isn't re-applied here.
  // v0.18.11 (ADR-0009) — Budget · Secteur · Timing added as multi-select
  // dimensions. Each is OR within itself, AND across dimensions: e.g.
  // {Prioritaire} + {Rive gauche} + {Immédiatement} shows only leads matching
  // all three. Empty array = dimension inactive (passes everything).
  const fScore   = state.filters.score   || [];
  // v0.18.15 (item C) — the date dimension now reads from the band (leadsPeriode),
  // NOT the Filters panel. The date MATH below is byte-for-byte unchanged; only
  // the SOURCE moved. The preset vocabulary maps 1:1 (today/7d/30d/month/null).
  const fPeriode = state.leadsPeriode    || null;
  // v0.18.15 (item A) — Campagne is a functional band dimension on Leads. null = all.
  const fCampagne = state.leadsCampagne  || null;
  const fBudget  = state.filters.budget  || [];
  const fSecteur = state.filters.secteur || [];
  const fTiming  = state.filters.timing  || [];
  const dateFloor = (() => {
    if (fPeriode !== "7d" && fPeriode !== "30d") return null;
    const d = new Date();
    d.setDate(d.getDate() - (fPeriode === "7d" ? 7 : 30));
    d.setHours(0, 0, 0, 0);
    return d;
  })();
  const monthPrefix = new Date().toISOString().slice(0, 7);  // "YYYY-MM"
  const refined = visible.filter(l => {
    if (fScore.length) {
      const s = SCORE_VALUES.includes(l.score) ? l.score : "none";  // unset/unknown → "none"
      if (!fScore.includes(s)) return false;
    }
    if (fCampagne && l.campaign !== fCampagne)                     return false;
    if (fBudget.length  && !fBudget.includes(l.budget))            return false;
    if (fSecteur.length && !fSecteur.includes(l.secteur))          return false;
    if (fTiming.length  && !fTiming.includes(leadTimeline(l)))     return false;
    if (fPeriode) {
      if (!l.createdAt) return false;
      if (fPeriode === "today")      { if (l.createdAt.slice(0, 10) !== todayIso)     return false; }
      else if (fPeriode === "month") { if (l.createdAt.slice(0, 7)  !== monthPrefix)  return false; }
      else if (dateFloor)            { if (new Date(l.createdAt) < dateFloor)         return false; }
    }
    return true;
  });

  // v0.18 — Vue rapide chips (ADR-0014). Constraints richer than the Filters
  // panel can express, layered on as an intersection on top of the panel-
  // driven set. Each active chip narrows further; multiple chips compose.
  const vrConstrained = (state.vueRapide || []).reduce((set, chip) => {
    if (chip.kind === "demandes-immediates") {
      return set.filter(l => l.contactPreference === "Tout de suite" && l.status === "nouveau");
    }
    if (chip.kind === "aging-nouveau") {
      return set.filter(l => l.status === "nouveau" && leadAgeDays(l) > AGING_THRESHOLD_DAYS);
    }
    if (chip.kind === "campagne") {
      return set.filter(l => l.campaign === chip.value);
    }
    return set;
  }, refined);

  // Apply column sort. null = default order (by state.leads insertion = by id).
  // Sort happens LAST so filter + search don't depend on sort direction.
  if (state.leadsSort) {
    const cmp = leadComparator(state.leadsSort.column);
    const factor = state.leadsSort.direction === "asc" ? 1 : -1;
    vrConstrained.sort((a, b) => cmp(a, b) * factor);
  }

  return {
    visible: vrConstrained,
    pipeline,
    type,
    search,
    leadsInType: baseFiltered,  // v0.9.2 — used by cross-cutting KPI card counts
    counts: { stageCounts, lostCount, totalFiltered: baseFiltered.length, typeCounts },
  };
}

/* v0.18.11 — filter-aware CSV export (executes ADR-0009's deferred export, paired
   with the advanced filters; CHANGELOG-tracked, no new ADR). Exports EXACTLY the
   currently-filtered+visible set — it reads computeLeadsView().visible, the same
   list the table paginates, so it honours every active filter (and, once Item 3
   archivage lands, the archived exclusion baked into computeLeadsView comes along
   for free — no separate re-filter). Display labels, not internal keys (it's for
   humans / a future Apimmo import): score → Prioritaire/…, statut → Nouveau/…,
   timing → full form wording. No library (stack lock, no build step): build a
   string, download via Blob + anchor. French headers (UI is French). A UTF-8 BOM
   is prepended so Excel renders the accents (é, …) correctly. */
const CSV_COLUMNS = [
  { header: "Prénom / Nom",        get: l => l.name },
  { header: "Email",              get: l => l.email },
  { header: "Téléphone",          get: l => l.phone },
  { header: "Secteur recherché",  get: l => l.secteur },
  { header: "Timing",             get: l => leadTimeline(l) },
  { header: "Budget",             get: l => l.budget },
  { header: "Caractéristiques",   get: l => (l.features || []).join(" · ") },
  { header: "Score",              get: l => scoreLabel(l.score) },
  { header: "Statut",             get: l => stageLabel(l.type, l.status) },
  { header: "Date du lead",       get: l => formatLeadDateHuman(l.createdAt) },
  { header: "Notes",              get: l => l.notes },
];

function csvEscape(value) {
  // RFC 4180: wrap in double-quotes when the field contains a comma, quote,
  // or newline; escape embedded quotes by doubling them. Always quoting is
  // also valid and simpler — do that, so French free-text notes are safe.
  const s = (value == null ? "" : String(value));
  return `"${s.replace(/"/g, '""')}"`;
}

function buildLeadsCsv(leads) {
  const head = CSV_COLUMNS.map(c => csvEscape(c.header)).join(",");
  const rows = leads.map(l => CSV_COLUMNS.map(c => csvEscape(c.get(l))).join(","));
  return [head, ...rows].join("\r\n");
}

function exportLeadsCsv() {
  const view = computeLeadsView();           // the current filtered/sorted set
  const leads = view.visible;
  const csv = "\uFEFF" + buildLeadsCsv(leads);  // BOM for Excel UTF-8
  const stamp = new Date().toISOString().slice(0, 10);  // YYYY-MM-DD
  const filename = `leads-openhouse-${stamp}.csv`;
  try {
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 0);
  } catch (e) {
    // Blob/URL unavailable (very old browser) — silent no-op; demo-acceptable.
  }
}

/* v0.10.3 — Leads mode card (V11). One card visually split into two
   halves by a 1px divider, icon + label per half. Active half picks
   up --type-accent-bg + --type-accent-strong for the icon badge.
   data-action is unchanged (set-lead-type) — handler is the same as
   the old toggle-tab path. Slimmer than KPI cards: no count, counts
   live in the KPI row below. */
function renderLeadsModeCard(opts) {
  // v0.18.15 — relocated into the top control band on both pages (item A/B).
  //   Leads:     functional — buyer half toggles state.leadType (as before).
  //   Dashboard: inert (opts.inert) — same buyer-active / seller-greyed STATE,
  //              but the buyer half is a non-actioned element so it toggles
  //              nothing (intent 3: consistency placeholder, functional in V2).
  const inert = !!(opts && opts.inert);
  const half = (typeKey, iconKey, label) => {
    const active   = state.leadType === typeKey;
    // V1: Vendeurs is present but disabled — visible roadmap promise, not a
    // working surface. Inert (data-action="seller-soon" is a no-op handler) +
    // "Bientôt disponible" tooltip. Seller code paths stay in file.
    const disabled = typeKey === "seller";
    if (disabled) {
      return `
      <div class="leads-mode-half leads-mode-half--disabled"
           role="tab" aria-selected="false" aria-disabled="true"
           ${inert ? "" : `data-action="seller-soon"`}
           title="Bientôt disponible">
        <span class="leads-mode-half-ico">${icon[iconKey]()}</span>
        <span>${label}</span>
        <span class="leads-mode-half-soon">Bientôt</span>
      </div>
    `;
    }
    // Buyer half: a live button on Leads; a non-actioned div on the Dashboard.
    if (inert) {
      return `
      <div class="leads-mode-half leads-mode-half--inert"
           role="tab" aria-selected="${active}">
        <span class="leads-mode-half-ico">${icon[iconKey]()}</span>
        <span>${label}</span>
      </div>
    `;
    }
    return `
      <button class="leads-mode-half"
              role="tab"
              aria-selected="${active}"
              data-action="set-lead-type"
              data-type="${typeKey}">
        <span class="leads-mode-half-ico">${icon[iconKey]()}</span>
        <span>${label}</span>
      </button>
    `;
  };
  return `
    <div class="leads-mode-card" role="tablist" aria-label="Type de lead">
      ${half("buyer",  "home", "Acquéreurs")}
      <div class="leads-mode-divider" aria-hidden="true"></div>
      ${half("seller", "key",  "Vendeurs")}
    </div>
  `;
}

/* Context chip: shows raw active-type count in words. Now lives in
   .leads-meta-row below the mode card. Grammar handles singular/plural.
   v0.10.3 — reshaped to match the muted outlined-chip style used
   elsewhere (no type-accent fill; the mode card carries that signal). */
function renderLeadsContextChip(typeKey, count) {
  const noun    = typeKey === "buyer" ? "acquéreur" : "vendeur";
  const plural  = count === 1 ? "" : "s";
  const adj     = count === 1 ? "actif" : "actifs";
  const iconKey = typeKey === "buyer" ? "home" : "key";
  return `
    <span class="leads-context-chip" aria-label="${count} ${noun}${plural} ${adj}">
      ${icon[iconKey]()}
      <span>${count} ${noun}${plural} ${adj}</span>
    </span>
  `;
}

/* In-page table search. Distinct from the topbar search, which is DORMANT and

/* Stage KPI cards (Step 2 Layer 2): one Prodex-style card per pipeline
   stage for the active type. Each card shows an icon badge (circular,
   stage-tinted), label, and count. Clicking a card filters the table to
   that stage; clicking the active card deselects (back to "all").
   This row replaces both the Layer 1 pipeline bar AND the filter tabs
   row — the KPI cards ARE the filter. Tous = no card selected (default).
   Perdu: terminal state, not in this row — will live inside the Filter
   button popover (see renderLeadsTable).

   v0.10 — KPI row reordered by manager priority (not pipeline flow),
   and cards progressively hide at narrower viewports via CSS breakpoints
   (.stage-card--prio-{n}). Priority order reflects "which stage does the
   manager glance at first": À traiter (unactioned pile) tops the list;
   Converti (closed, historical) sits last. Active filter card never
   hides — see .stage-card--active rules in CSS.

   v0.9.2 — two changes to what renders in the row:
   1. Late-pipeline stages with near-zero counts are HIDDEN from the KPI
      row entirely (offer_made, converted, sold). The data still exists
      in state.agency.pipeline, is still selectable in the drawer's
      Qualification dropdown, still flows to Meta CAPI — this is a
      purely visual drop. Managers who want converted/sold counts go to
      the Tableau de bord (Step 4) or the Database page.
   2. Two CROSS-CUTTING cards are prepended: "Leads aujourd'hui" (filters
      by createdAt=today, any stage) and "Non assignés" (filters by
      assignedAgentId=null, any stage). Both use neutral colors to read
      as a different category from pipeline cards. Both use new filter
      values on state.filterTab ("today" and "unassigned") handled in
      computeLeadsView. */
const STAGE_PRIORITY = {
  buyer: ["to_process", "qualified", "visit_planned", "offer_made", "contacted", "converted"],
  seller: ["to_process", "mandate_signed", "appointment", "estimation_sent", "contacted", "sold"],
};

// Stages whose counts are too low/flat to earn KPI row real estate.
// Pipeline data + drawer dropdown + CAPI feedback untouched — this is
// visual only. Revisit if an agency reports high-volume late stages.
const STAGE_HIDE_FROM_KPI = {
  buyer:  ["offer_made", "converted"],
  seller: ["sold"],
};

// Cross-cutting KPI cards — prepended before pipeline cards in the row.
// Each card carries its own filter value (not a stage id) which
// computeLeadsView handles specially. `neutral: true` triggers the
// off-palette badge/tint styling so they visually read as a different
// category from the pipeline stage cards.
function computeCrossCuttingCards(leads, activeFilter) {
  const today = new Date().toISOString().slice(0, 10);  // "YYYY-MM-DD"
  // v0.10.3: exclude lost leads to match filterTab="today" filter
  // behavior. Without this, clicking the "Leads aujourd'hui" card
  // could show fewer leads than the card count suggested if any of
  // today's leads had been marked lost. Latent bug caught in v0.10.2
  // audit (handover audit Q1).
  // v0.10.4: createdAt is now a full ISO datetime (Path A), so compare
  // against its date portion (first 10 chars) rather than the whole
  // string. Without this slice the count would always be 0.
  const todayCount = leads.filter(l =>
    l.createdAt && l.createdAt.slice(0, 10) === today && l.status !== "lost"
  ).length;
  // v0.15 — the "Non assignés" card was removed: the V1 brief drops "Non
  // assigné" (no assignment model in V1), and the card also predated the
  // 4-stage taxonomy. Stage narrowing is carried by the Statut filter / stage
  // cards. assignedAgentId stays in the data for V2.
  return [
    {
      filterValue: "today",
      label: "Leads aujourd'hui",
      iconKey: "clock",
      count: todayCount,
      active: activeFilter === "today",
    },
  ];
}

function renderStageCards(pipeline, stageCounts, activeStage, typeKey, allLeads) {
  const stageIcons = {
    to_process:      "inbox",
    contacted:       "phone",
    qualified:       "target",
    visit_planned:   "calendar",
    offer_made:      "fileText",
    converted:       "trophy",
    estimation_sent: "fileText",
    appointment:     "calendar",
    mandate_signed:  "fileText",
    sold:            "trophy",
  };
  const hideList = STAGE_HIDE_FROM_KPI[typeKey] || [];
  // Reorder pipeline by priority for the KPI row only — pipeline data
  // itself stays in flow order (used by flow-ordered renderers elsewhere).
  // Filter out hidden stages before ordering.
  const priorityOrder = STAGE_PRIORITY[typeKey] || [];
  const orderedPipeline = pipeline
    .filter(s => !hideList.includes(s.id))
    .sort((a, b) => {
      const ai = priorityOrder.indexOf(a.id);
      const bi = priorityOrder.indexOf(b.id);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });

  // Build the combined card list: cross-cutting first, pipeline after.
  // All cards share the .stage-card shell + .stage-card--prio-{n}
  // progressive-hide classes. Non-stage cards add .stage-card--neutral
  // for the off-palette styling.
  const crossCutting = computeCrossCuttingCards(allLeads, activeStage);
  const crossCuttingHtml = crossCutting.map((card, index) => {
    const active = card.active;
    return `
      <button class="stage-card stage-card--neutral stage-card--prio-${index} ${active ? "stage-card--active" : ""}"
              data-action="set-filter-tab"
              data-tab-id="${card.filterValue}"
              aria-pressed="${active}">
        <span class="stage-card-icon">${icon[card.iconKey]()}</span>
        <span class="stage-card-text">
          <span class="stage-card-label">${card.label}</span>
          <span class="stage-card-count">${card.count}</span>
        </span>
      </button>
    `;
  }).join("");

  const pipelineHtml = orderedPipeline.map((stage, i) => {
    const index = i + crossCutting.length;  // continue priority index across both card groups
    const c = stageColors(stage.id);
    const n = stageCounts[stage.id] || 0;
    const active = activeStage === stage.id;
    const iconKey = stageIcons[stage.id] || "inbox";
    return `
      <button class="stage-card stage-card--prio-${index} ${active ? "stage-card--active" : ""}"
              data-action="set-filter-tab"
              data-tab-id="${stage.id}"
              aria-pressed="${active}"
              style="--stage-bg:${c.bg};--stage-fg:${c.fg};--stage-deep:${c.deep};">
        <span class="stage-card-icon">${icon[iconKey]()}</span>
        <span class="stage-card-text">
          <span class="stage-card-label">${stage.label}</span>
          <span class="stage-card-count">${n}</span>
        </span>
      </button>
    `;
  }).join("");

  return `<div class="stage-cards" role="group" aria-label="Filtres rapides">${crossCuttingHtml}${pipelineHtml}</div>`;
}

/* DORMANT in V1 (since v0.15): Score is now a dropdown in the table/card via
   renderScoreCell (Greg brief Update 26-05 (2)), mirroring Statut. This
   click-to-cycle chip + its `cycle-score` handler are no longer rendered;
   kept in-file for reference / possible V2 reuse. */
function renderScoreChip(score, leadId) {
  const map = {
    hot:  { label: "Prioritaire", mod: "hot"  },
    warm: { label: "Intéressant", mod: "warm" },
    cold: { label: "Faible", mod: "cold" },
  };
  const m = map[score] || { label: score || "—", mod: "none" };
  const inner = `<span class="score-chip-dot"></span>${m.label}`;
  // V1: when a leadId is passed, the chip is a click-to-cycle control
  // (Prioritaire→Intéressant→Faible), editable straight from the table/card. No modal,
  // no save step — setState mutates the lead. The score IS the qualification.
  if (leadId != null) {
    return `<button class="score-chip score-chip--${m.mod} score-chip--editable" data-action="cycle-score" data-lead-id="${leadId}" title="Cliquer pour changer le score" aria-label="Score : ${m.label}. Cliquer pour changer.">${inner}</button>`;
  }
  return `<span class="score-chip score-chip--${m.mod}">${inner}</span>`;
}

/* Score dropdown control — coloured pill + instant menu (Prioritaire/Intéressant/Faible),
   mirroring renderStatusCell. Used on the drawer header qualification line so
   Statut and Score read as one dropdown family. Reuses the set-score handler
   (same lead.score field as the table's click-to-cycle, so they stay in sync);
   opts.surface keys the open-state independently per surface. */
function renderScoreCell(lead, opts = {}) {
  const surface = opts.surface || "row";
  const map = {
    hot:  { label: "Prioritaire", mod: "hot"  },
    warm: { label: "Intéressant", mod: "warm" },
    cold: { label: "Faible", mod: "cold" },
    none: { label: "Non évalué", mod: "none" },
  };
  const m = map[lead.score] || { label: "Non évalué", mod: "none" };
  const open = state.openScoreMenu;
  const isOpen = !!open && open.id === lead.id && open.surface === surface;
  const opts3 = [
    { v: "hot",  label: "Prioritaire", mod: "hot"  },
    { v: "warm", label: "Intéressant", mod: "warm" },
    { v: "cold", label: "Faible", mod: "cold" },
    { v: "none", label: "Non évalué", mod: "none" },
  ];
  const menu = isOpen ? `
    <div class="score-menu${opts.menuUp ? " score-menu--up" : ""}${surface === "row" ? " score-menu--end" : ""}" role="listbox">
      ${opts3.map(o => {
        const on = (o.v === lead.score) || (o.v === "none" && !map[lead.score]);
        return `<button class="score-menu-item${on ? " score-menu-item--on" : ""}"
                        role="option" aria-selected="${on}"
                        data-action="set-score" data-lead-id="${lead.id}" data-score="${o.v}">
          <span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}${on ? `<span class="score-check">${icon.check()}</span>` : ""}
        </button>`;
      }).join("")}
    </div>` : "";
  return `
    <span class="score-wrap">
      <button class="score-pill score-pill--${m.mod}" data-action="toggle-score-menu" data-lead-id="${lead.id}" data-surface="${surface}"
              aria-haspopup="listbox" aria-expanded="${isOpen}" title="Changer le score">
        <span class="score-chip-dot"></span>
        <span class="score-pill-label">${m.label}</span>
        ${icon.chevronDown()}
      </button>
      ${menu}
    </span>`;
}

/* Statut cell (v0.13.0) — the inline-editable status control for the table
   and mobile card. Renders a coloured pill showing the current stage; click
   opens an instant dropdown of the 4 buyer stages (Greg docx brief: "dropdown
   instantané, auto-save, pas de popup"). Selecting sets lead.status directly
   and re-renders — no modal, no save step. "Perdu" is shown when a lead is
   already lost (terminal), but isn't offered in the dropdown (re-activate by
   picking a forward stage; marking-as-lost belongs to the deferred feedback
   flow). The pill is its own [data-action] so row-click never fires under it. */
function renderStatusCell(lead, opts = {}) {
  // opts.surface: "row" (table/card, default) | "drawer". opts.menuUp opens the
  // menu upward — DORMANT since v0.16.1: nothing currently sets menuUp:true (the
  // drawer passes false; the old bottom bulk bar that needed it was removed).
  // Kept as a capability for a future menu that sits near the viewport bottom.
  // open-state is keyed by { id, surface } so a lead's row menu and drawer menu
  // are independent — opening one doesn't pop the other (v0.13.2).
  const surface = opts.surface || "row";
  const c = stageColors(lead.status);
  const label = stageLabel("buyer", lead.status);
  const open = state.openStatusMenu;
  const isOpen = !!open && open.id === lead.id && open.surface === surface;
  const stages = (state.agency.pipeline.buyer || []);
  const menu = isOpen ? `
    <div class="status-menu${opts.menuUp ? " status-menu--up" : ""}${surface === "row" ? " status-menu--end" : ""}" role="listbox">
      ${stages.map(s => {
        const sc = stageColors(s.id);
        const on = s.id === lead.status;
        return `<button class="status-menu-item${on ? " status-menu-item--on" : ""}"
                        role="option" aria-selected="${on}"
                        data-action="set-status" data-lead-id="${lead.id}" data-status="${s.id}">
          <span class="status-dot" style="background:${sc.fg};"></span>${s.label}${on ? `<span class="status-check">${icon.check()}</span>` : ""}
        </button>`;
      }).join("")}
    </div>` : "";
  return `
    <span class="status-wrap">
      <button class="status-pill" data-action="toggle-status-menu" data-lead-id="${lead.id}" data-surface="${surface}"
              style="background:${c.bg};color:${c.deep};" aria-haspopup="listbox" aria-expanded="${isOpen}"
              title="Changer le statut">
        <span class="status-dot" style="background:${c.fg};"></span>
        <span class="status-pill-label">${label}</span>
        ${icon.chevronDown()}
      </button>
      ${menu}
    </span>`;
}

/* Source icon: compact branded tile. Pure CSS + initial letter — we avoid
   shipping brand SVGs both for trademark hygiene and for a consistent
   visual weight across sources at 18px. */
function renderSourceIcon(source) {
  // Upgraded from text-char to SVG chip (v0.10). Used in drawer header;
  // future Filter popover + re-added table column will reuse this primitive.
  const map = {
    ig:     { title: "Instagram",    iconKey: "instagram" },
    fb:     { title: "Facebook",     iconKey: "facebook"  },
    web:    { title: "Site web",     iconKey: "globe"     },
    email:  { title: "Email",        iconKey: "mail"      },
    manual: { title: "Ajout manuel", iconKey: "userPlus"  },
  };
  const m = map[source] || { title: source || "Inconnu", iconKey: "help" };
  return `<span class="source-chip source-chip--${source}" title="${m.title}" aria-label="Source : ${m.title}">${icon[m.iconKey]()}</span>`;

/* Type chip (v0.10.1) — buyer/seller identifier in the drawer header
   chip row. Blue-tinted for Acquéreur, amber-tinted for Vendeur. Uses
   the same type-accent palette family as the Leads page's 4px top
   band, so lead type identity reads consistently across the app. */
function renderTypeChip(type) {
  const label = typeLabel(type);  // "Acquéreur" / "Vendeur"
  return `<span class="type-chip type-chip--${type}">${label}</span>`;
}

/* v0.18.16 — static quality (score) chip for the Archives/Corbeille Qualité
   column. Mirrors the Leads score-chip treatment (Prioritaire / Intéressant /
   Faible / Non évalué) but is non-interactive. Unknown/unset → "none". */
function renderQualiteChip(score) {
  const key = SCORE_VALUES.includes(score) ? score : "none";

}

/* Verify badge (v0.10.1) — phone-verified quality signal in the drawer
   header. Green pill with checkmark when phoneVerified=true; amber
   pill with warning triangle when false. Inline with the phone number. */
function renderVerifyBadge(verified) {
  if (verified) {
    return `<span class="verify-badge verify-badge--ok">${icon.check()}Vérifié</span>`;
  }
  return `<span class="verify-badge verify-badge--no">${icon.alertTriangle()}Non vérifié</span>`;

/* Empty states. kind="no-sellers" when type=seller and no seller leads
   exist at all. kind="no-match" when filter + search returned nothing. */
function renderLeadsEmptyState(kind) {
  if (kind === "no-sellers") {
    return `
      <div class="leads-empty">
        <div class="leads-empty-title">Aucun vendeur pour l'instant</div>
        <div class="leads-empty-body">Les leads vendeurs arrivent via les formulaires Meta marqués « vendeur » ou par ajout manuel. Utilisez le bouton « + » en haut à droite pour saisir un vendeur.</div>
      </div>
    `;
  }
  return `
    <div class="leads-empty">
      <div class="leads-empty-title">Aucun résultat</div>
      <div class="leads-empty-body">Aucun lead ne correspond à ce filtre. Effacez la recherche, déselectionnez l'étape active, ou essayez un autre critère.</div>
    </div>

}

/* Single table row. Click anywhere on the row opens the drawer for that
   lead — uses the existing open-drawer action. Selected row carries
   data-selected for a subtle highlight. Agent column falls back to an
   em-dash when unassigned; same convention as the Layer 1 card. */
/* Sortable column header. `key` matches the leadComparator switch keys +
   the column width modifier class. Clickable. Displays a tri-state
   indicator: unsorted → muted double-chevron; active asc → arrow up;
   active desc → arrow down. Click cycles desc → asc → unsorted. */
function renderColumnHeader(key, label, colClass) {
  const sort = state.leadsSort;
  const isActive = sort && sort.column === key;
  let indicator;
  if (!isActive) {
    indicator = `<span class="leads-col-sort leads-col-sort--idle">${icon.chevronsUpDown()}</span>`;
  } else if (sort.direction === "desc") {
    indicator = `<span class="leads-col-sort leads-col-sort--active">${icon.arrowDown()}</span>`;
  } else {
    indicator = `<span class="leads-col-sort leads-col-sort--active">${icon.arrowUp()}</span>`;
  }
  return `
    <button class="leads-col ${colClass} leads-col-header"
            data-action="sort-column"
            data-column="${key}"
            aria-sort="${isActive ? sort.direction + "ending" : "none"}">
      <span>${label}</span>${indicator}
    </button>
  `;
}

/* Single table row. In default mode, click = open drawer. In select mode,
   click = toggle selection for that lead (drawer NOT opened). The mode
   branch happens in the click handler, not here — the row always carries
   data-lead-id + a dual-purpose data-action. */
function renderLeadRow(lead) {
  const selected     = state.drawer?.leadId === lead.id;
  const picked       = state.selectedLeadIds.includes(lead.id);
  // V1 table (v0.18.9, 31-05 redirect): Date · Nom · Budget · Secteur · Timing ·
  // Statut · Score. Date moved first; email-under-name removed (email stays in
  // the drawer). Agent column removed (no assignment in V1; assignedAgentId stays
  // for V2). Secteur and Timing are separate columns — never merged (Greg §3).
  // Statut is inline-editable via renderStatusCell; Score via renderScoreCell.
  const secteur      = lead.secteur || "—";
  const timing       = timingShort(leadTimeline(lead));
  const checkboxCell = state.selectionMode
    ? `<div class="leads-col leads-col--check"><span class="leads-checkbox ${picked ? "leads-checkbox--on" : ""}" aria-hidden="true">${picked ? icon.check() : ""}</span></div>`
    : "";
  return `
    <div class="leads-row${picked ? " leads-row--picked" : ""}"
         data-action="row-click"
         data-lead-id="${lead.id}"
         data-selected="${selected}"
         role="button" tabindex="0">
      ${checkboxCell}
      <div class="leads-col leads-col--date">${formatLeadDateHuman(lead.createdAt)}</div>
      <div class="leads-col leads-col--nom">
        ${renderAvatar(lead.initials, lead.tone, 34)}
        <div class="leads-col-nom-text">
          <div class="leads-col-nom-name">${lead.name}</div>
        </div>
      </div>
      <div class="leads-col leads-col--budget"><span class="budget-tag">${leadPrice(lead)}</span></div>
      <div class="leads-col leads-col--secteur">${secteur}</div>
      <div class="leads-col leads-col--timing">${timing}</div>
      <div class="leads-col leads-col--statut">${renderStatusCell(lead)}</div>
      <div class="leads-col leads-col--score">${renderScoreCell(lead, { surface: "row" })}</div>
    </div>
  `;
}

/* DORMANT in V1 (since v0.11.2): renderActivityBadges + the ACTIVITY_* maps
   are no longer called — renderAttributeIcons replaced the mobile badges (the
   action model couldn't be truthful in V1; see V1_SCOPE §2.5). Kept in-file
   for V2 when lead.activity[] returns.
   Activity badges (v0.10.2 update). Returns HTML for the vertical stack
   of outline badges on the mobile card's right side. ALL 4 badges always
   render — done types get the full-stroke treatment, not-yet-done types
   get a muted dashed-border treatment. This gives the agent a glance
   view of the complete touchpoint checklist per lead, not just what's
   been done. Order is fixed: call, email, whatsapp, note.

   v0.10.0 shipped "one badge per distinct type present"; v0.10.2 shifts
   to "always show all 4, with done vs pending visual distinction" per
   spec locked in §10b. Also: badges are slightly smaller than v0.10.1
   to reduce visual weight further. */
const ACTIVITY_ORDER = ["call", "email", "whatsapp", "note"];
const ACTIVITY_ICON  = { call: "phone", email: "mail", whatsapp: "messageCircle", note: "fileText" };
const ACTIVITY_LABEL = { call: "Appelé", email: "Email envoyé", whatsapp: "WhatsApp", note: "Note ajoutée" };
const ACTIVITY_LABEL_PENDING = { call: "Pas encore appelé", email: "Pas encore d'email", whatsapp: "Pas encore de WhatsApp", note: "Pas encore de note" };
function renderActivityBadges(activity) {
  const doneTypes = new Set((activity || []).map(a => a.type));
  return ACTIVITY_ORDER
    .map(t => {
      const done = doneTypes.has(t);
      const label = done ? ACTIVITY_LABEL[t] : ACTIVITY_LABEL_PENDING[t];
      const mod = done ? "activity-badge--done" : "activity-badge--pending";
      return `<span class="activity-badge ${mod}" title="${label}" aria-label="${label}">${icon[ACTIVITY_ICON[t]]()}</span>`;
    })
    .join("");
}

/* Mobile card attribute icons (v0.11.2) — replaces renderActivityBadges in
   V1. Action badges read off the deferred lead.activity[] and couldn't be
   truthful (no send-callback from mailto:/wa.me). These four icons read off
   VERIFIABLE data and light black when true, muted when absent:
     • note present       — lead.notes non-empty
     • phone verified      — lead.phoneVerified
     • contact urgency     — lead.contactPreference === "Tout de suite"
     • specific criteria   — lead.features[] non-empty
   See V1_SCOPE §2.5. renderActivityBadges + activity[] kept dormant for V2. */
function renderAttributeIcons(lead) {
  const attrs = [
    { on: !!(lead.notes && lead.notes.trim()),            iconKey: "fileText", label: "Note présente" },
    { on: !!lead.phoneVerified,                           iconKey: "check",    label: "Téléphone vérifié" },
    { on: lead.contactPreference === "Tout de suite",     iconKey: "bell",     label: "À contacter tout de suite" },
    { on: !!(lead.features && lead.features.length),      iconKey: "star",     label: "Critères spécifiques" },
  ];
  return attrs
    .map(a => `<span class="attr-icon ${a.on ? "attr-icon--on" : "attr-icon--off"}" title="${a.label}" aria-label="${a.label}${a.on ? "" : " : non"}">${icon[a.iconKey]()}</span>`)
    .join("");
}

/* v0.11.5 — mobile-only legend explaining the card attribute icons. Shown as
   the last bloc of the drawer Infos tab on mobile (the icons only appear on
   the mobile card). Mirrors renderAttributeIcons — keep the two in sync. */
/* Icon legend for the attribute icons shown on lead rows/cards.
   placement:
     "table"  (v0.18.15, item H) — subtle one-row footnote UNDER the leads table.
              Short 1–2-word labels so the four pairs sit on one line; light muted
              type; NO .drawer-section chrome. Rendered mobile-only (matches the
              current mobile-only row-icon visibility).
     "drawer" (legacy) — full sentences in a .drawer-section. No longer called in
              V1 (the legend left the drawer footer at v0.18.15) but kept so the
              drawer can show it again without a rewrite. */
function renderIconLegend(placement) {
  const where = placement || "drawer";
  const tableLabels = {
    fileText: "Note",
    check:    "Tél. vérifié",
    bell:     "Urgent",
    star:     "Critères",
  };
  const items = [
    { iconKey: "fileText", drawer: "Une note a été ajoutée" },
    { iconKey: "check",    drawer: "Téléphone vérifié" },
    { iconKey: "bell",     drawer: "À contacter tout de suite" },
    { iconKey: "star",     drawer: "Critères de recherche spécifiques" },
  ];
  const rows = items.map(it => {
    const label = where === "table" ? tableLabels[it.iconKey] : it.drawer;
    return `
          <div class="icon-legend-row">
            <span class="attr-icon attr-icon--on">${icon[it.iconKey]()}</span>
            <span class="icon-legend-label">${label}</span>
          </div>`;
  }).join("");

  if (where === "table") {
    return `
    <div class="leads-legend" aria-label="Légende des icônes">
      <span class="leads-legend-label">Légende</span>
      <div class="icon-legend">${rows}</div>
    </div>`;
  }
  return `
    <div class="drawer-section">
      <div class="drawer-section-label">Légende des icônes</div>
      <div class="icon-legend">${rows}</div>
      <p class="icon-legend-hint">Une icône noire = information présente ; grisée = absente.</p>
    </div>`;
}

/* Mobile lead card (v0.10.0) — renders when viewport ≤ 600px (CSS swaps
   which of .leads-table-body / .leads-cards-list is visible).

   Layout (Variant B locked in mockup v5):
   - Avatar vertically centered on the left (40px, content-colored)
   - Content block (flex column) to the right:
       Row 1: name + inline score chip
       Row 2: budget · secteur · timeline
       Row 3: source chip + date + inline Statut pill
   - Attribute-icon stack on the far right — four data-verified icons
     (renderAttributeIcons): note present, phone verified, contact
     "Tout de suite", specific criteria. Replaced the activity-badge
     stack at v0.11.2 (activity[] deferred to V2). v0.13.1: Row 2
     shows secteur, not zone, to match the de-zoned table.

   Same data-action contract as renderLeadRow: click = open drawer in
   default mode, toggle selection in select mode. */
function renderLeadCard(lead) {
  const selected = state.drawer?.leadId === lead.id;
  const picked   = state.selectedLeadIds.includes(lead.id);
  const secteur  = lead.secteur || "—";
  const timeline = leadTimeline(lead);
  const checkbox = state.selectionMode
    ? `<span class="leads-card-checkbox ${picked ? "leads-card-checkbox--on" : ""}" aria-hidden="true">${picked ? icon.check() : ""}</span>`
    : "";
  return `
    <div class="leads-card${picked ? " leads-card--picked" : ""}"
         data-action="row-click"
         data-lead-id="${lead.id}"
         data-selected="${selected}"
         role="button" tabindex="0">
      ${checkbox}
      ${renderAvatar(lead.initials, lead.tone, 40)}
      <div class="leads-card-content">
        <div class="leads-card-row1">
          <div class="leads-card-name">${lead.name}</div>
          ${renderScoreCell(lead, { surface: "row" })}
        </div>
        <div class="leads-card-summary">${leadPrice(lead)} · ${secteur}${timeline ? ` · ${timeline}` : ""}</div>
        <div class="leads-card-meta">
          ${renderSourceIcon(lead.source)}
          <span class="leads-card-date">${formatLeadDate(lead.createdAt, { showYear: false, longMonth: true, showTime: true })}</span>
          ${renderStatusCell(lead)}
        </div>
      </div>
      <div class="leads-card-attrs">${renderAttributeIcons(lead)}</div>
    </div>
  `;
}

/* v0.16.1 — bulk popovers, opened from the toolbar's Statut/Score buttons.

   inline dropdowns); popovers open downward (default) since the toolbar

          <span class="status-dot" style="background:${sc.fg};"></span>${s.label}
        </button>`;
