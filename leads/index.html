/* Stage KPI cards (Step 2 Layer 2): one Prodex-style card per pipeline
   stage for the active type. Each card shows an icon badge (circular,
   stage-tinted), label, and count. Clicking a card filters the table to
   that stage; clicking the active card deselects (back to "all").
   This row replaces both the Layer 1 pipeline bar AND the filter tabs
   row — the KPI cards ARE the filter. Tous = no card selected (default).
   Perdu: terminal state, not in this row — will live inside the Filter
   button popover (see renderLeadsTable).

   v0.10 — KPI row reordered by manager priority (not pipeline flow),
   and cards progressively hide at narrower viewports via CSS breakpoints
   (.stage-card--prio-{n}). Priority order reflects "which stage does the
   manager glance at first": À traiter (unactioned pile) tops the list;
   Converti (closed, historical) sits last. Active filter card never
   hides — see .stage-card--active rules in CSS.

   v0.9.2 — two changes to what renders in the row:
   1. Late-pipeline stages with near-zero counts are HIDDEN from the KPI
      row entirely (offer_made, converted, sold). The data still exists
      in state.agency.pipeline, is still selectable in the drawer's
      Qualification dropdown, still flows to Meta CAPI — this is a
      purely visual drop. Managers who want converted/sold counts go to
      the Tableau de bord (Step 4) or the Database page.
   2. Two CROSS-CUTTING cards are prepended: "Leads aujourd'hui" (filters
      by createdAt=today, any stage) and "Non assignés" (filters by
      assignedAgentId=null, any stage). Both use neutral colors to read
      as a different category from pipeline cards. Both use new filter
      values on state.filterTab ("today" and "unassigned") handled in
      computeLeadsView. */
const STAGE_PRIORITY = {
  buyer: ["to_process", "qualified", "visit_planned", "offer_made", "contacted", "converted"],
  seller: ["to_process", "mandate_signed", "appointment", "estimation_sent", "contacted", "sold"],
};

// Stages whose counts are too low/flat to earn KPI row real estate.
// Pipeline data + drawer dropdown + CAPI feedback untouched — this is
// visual only. Revisit if an agency reports high-volume late stages.
const STAGE_HIDE_FROM_KPI = {
  buyer:  ["offer_made", "converted"],
  seller: ["sold"],
};

// Cross-cutting KPI cards — prepended before pipeline cards in the row.
// Each card carries its own filter value (not a stage id) which
// computeLeadsView handles specially. `neutral: true` triggers the
// off-palette badge/tint styling so they visually read as a different
// category from the pipeline stage cards.
function computeCrossCuttingCards(leads, activeFilter) {
  const today = new Date().toISOString().slice(0, 10);  // "YYYY-MM-DD"
  // v0.10.3: exclude lost leads to match filterTab="today" filter
  // behavior. Without this, clicking the "Leads aujourd'hui" card
  // could show fewer leads than the card count suggested if any of
  // today's leads had been marked lost. Latent bug caught in v0.10.2
  // audit (handover audit Q1).
  // v0.10.4: createdAt is now a full ISO datetime (Path A), so compare
  // against its date portion (first 10 chars) rather than the whole
  // string. Without this slice the count would always be 0.
  const todayCount = leads.filter(l =>
    l.createdAt && l.createdAt.slice(0, 10) === today && l.status !== "lost"
  ).length;
  // v0.15 — the "Non assignés" card was removed: the V1 brief drops "Non
  // assigné" (no assignment model in V1), and the card also predated the
  // 4-stage taxonomy. Stage narrowing is carried by the Statut filter / stage
  // cards. assignedAgentId stays in the data for V2.
  return [
    {
      filterValue: "today",
      label: "Leads aujourd'hui",
      iconKey: "clock",
      count: todayCount,
      active: activeFilter === "today",
    },
  ];
}

function renderStageCards(pipeline, stageCounts, activeStage, typeKey, allLeads) {
  const stageIcons = {
    to_process:      "inbox",
    contacted:       "phone",
    qualified:       "target",
    visit_planned:   "calendar",
    offer_made:      "fileText",
    converted:       "trophy",
    estimation_sent: "fileText",
    appointment:     "calendar",
    mandate_signed:  "fileText",
    sold:            "trophy",
  };
  const hideList = STAGE_HIDE_FROM_KPI[typeKey] || [];
  // Reorder pipeline by priority for the KPI row only — pipeline data
  // itself stays in flow order (used by flow-ordered renderers elsewhere).
  // Filter out hidden stages before ordering.
  const priorityOrder = STAGE_PRIORITY[typeKey] || [];
  const orderedPipeline = pipeline
    .filter(s => !hideList.includes(s.id))
    .sort((a, b) => {
      const ai = priorityOrder.indexOf(a.id);
      const bi = priorityOrder.indexOf(b.id);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });

  // Build the combined card list: cross-cutting first, pipeline after.
  // All cards share the .stage-card shell + .stage-card--prio-{n}
  // progressive-hide classes. Non-stage cards add .stage-card--neutral
  // for the off-palette styling.
  const crossCutting = computeCrossCuttingCards(allLeads, activeStage);
  const crossCuttingHtml = crossCutting.map((card, index) => {
    const active = card.active;
    return `
      <button class="stage-card stage-card--neutral stage-card--prio-${index} ${active ? "stage-card--active" : ""}"
              data-action="set-filter-tab"
              data-tab-id="${card.filterValue}"
              aria-pressed="${active}">
        <span class="stage-card-icon">${icon[card.iconKey]()}</span>
        <span class="stage-card-text">
          <span class="stage-card-label">${card.label}</span>
          <span class="stage-card-count">${card.count}</span>
        </span>
      </button>
    `;
  }).join("");

  const pipelineHtml = orderedPipeline.map((stage, i) => {
    const index = i + crossCutting.length;  // continue priority index across both card groups
    const c = stageColors(stage.id);
    const n = stageCounts[stage.id] || 0;
    const active = activeStage === stage.id;
    const iconKey = stageIcons[stage.id] || "inbox";
    return `
      <button class="stage-card stage-card--prio-${index} ${active ? "stage-card--active" : ""}"
              data-action="set-filter-tab"
              data-tab-id="${stage.id}"
              aria-pressed="${active}"
              style="--stage-bg:${c.bg};--stage-fg:${c.fg};--stage-deep:${c.deep};">
        <span class="stage-card-icon">${icon[iconKey]()}</span>
        <span class="stage-card-text">
          <span class="stage-card-label">${stage.label}</span>
          <span class="stage-card-count">${n}</span>
        </span>
      </button>
    `;
  }).join("");

  return `<div class="stage-cards" role="group" aria-label="Filtres rapides">${crossCuttingHtml}${pipelineHtml}</div>`;
}

/* DORMANT in V1 (since v0.15): Score is now a dropdown in the table/card via
   renderScoreCell (Greg brief Update 26-05 (2)), mirroring Statut. This
   click-to-cycle chip + its `cycle-score` handler are no longer rendered;
   kept in-file for reference / possible V2 reuse. */
function renderScoreChip(score, leadId) {
  const map = {
    hot:  { label: "Chaud", mod: "hot"  },
    warm: { label: "Tiède", mod: "warm" },
    cold: { label: "Froid", mod: "cold" },
  };
  const m = map[score] || { label: score || "—", mod: "none" };
  const inner = `<span class="score-chip-dot"></span>${m.label}`;
  // V1: when a leadId is passed, the chip is a click-to-cycle control
  // (Chaud→Tiède→Froid), editable straight from the table/card. No modal,
  // no save step — setState mutates the lead. The score IS the qualification.
  if (leadId != null) {
    return `<button class="score-chip score-chip--${m.mod} score-chip--editable" data-action="cycle-score" data-lead-id="${leadId}" title="Cliquer pour changer le score" aria-label="Score : ${m.label}. Cliquer pour changer.">${inner}</button>`;
  }
  return `<span class="score-chip score-chip--${m.mod}">${inner}</span>`;
}

/* Score dropdown control — coloured pill + instant menu (Chaud/Tiède/Froid),
   mirroring renderStatusCell. Used on the drawer header qualification line so
   Statut and Score read as one dropdown family. Reuses the set-score handler
   (same lead.score field as the table's click-to-cycle, so they stay in sync);
   opts.surface keys the open-state independently per surface. */
function renderScoreCell(lead, opts = {}) {
  const surface = opts.surface || "row";
  const map = {
    hot:  { label: "Chaud", mod: "hot"  },
    warm: { label: "Tiède", mod: "warm" },
    cold: { label: "Froid", mod: "cold" },
    none: { label: "Non évalué", mod: "none" },
  };
  const m = map[lead.score] || { label: "Non évalué", mod: "none" };
  const open = state.openScoreMenu;
  const isOpen = !!open && open.id === lead.id && open.surface === surface;
  const opts3 = [
    { v: "hot",  label: "Chaud", mod: "hot"  },
    { v: "warm", label: "Tiède", mod: "warm" },
    { v: "cold", label: "Froid", mod: "cold" },
    { v: "none", label: "Non évalué", mod: "none" },
  ];
  const menu = isOpen ? `
    <div class="score-menu${opts.menuUp ? " score-menu--up" : ""}${surface === "row" ? " score-menu--end" : ""}" role="listbox">
      ${opts3.map(o => {
        const on = (o.v === lead.score) || (o.v === "none" && !map[lead.score]);
        return `<button class="score-menu-item${on ? " score-menu-item--on" : ""}"
                        role="option" aria-selected="${on}"
                        data-action="set-score" data-lead-id="${lead.id}" data-score="${o.v}">
          <span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}${on ? `<span class="score-check">${icon.check()}</span>` : ""}
        </button>`;
      }).join("")}
    </div>` : "";
  return `
    <span class="score-wrap">
      <button class="score-pill score-pill--${m.mod}" data-action="toggle-score-menu" data-lead-id="${lead.id}" data-surface="${surface}"
              aria-haspopup="listbox" aria-expanded="${isOpen}" title="Changer le score">
        <span class="score-chip-dot"></span>
        <span class="score-pill-label">${m.label}</span>
        ${icon.chevronDown()}
      </button>
      ${menu}
    </span>`;
}

/* Statut cell (v0.13.0) — the inline-editable status control for the table
   and mobile card. Renders a coloured pill showing the current stage; click
   opens an instant dropdown of the 4 buyer stages (Greg docx brief: "dropdown
   instantané, auto-save, pas de popup"). Selecting sets lead.status directly
   and re-renders — no modal, no save step. "Perdu" is shown when a lead is
   already lost (terminal), but isn't offered in the dropdown (re-activate by
   picking a forward stage; marking-as-lost belongs to the deferred feedback
   flow). The pill is its own [data-action] so row-click never fires under it. */
function renderStatusCell(lead, opts = {}) {
  // opts.surface: "row" (table/card, default) | "drawer". opts.menuUp opens the
  // menu upward (drawer, where it sits at the bottom of a scrollable body).
  // open-state is keyed by { id, surface } so a lead's row menu and drawer menu
  // are independent — opening one doesn't pop the other (v0.13.2).
  const surface = opts.surface || "row";
  const c = stageColors(lead.status);
  const label = stageLabel("buyer", lead.status);
  const open = state.openStatusMenu;
  const isOpen = !!open && open.id === lead.id && open.surface === surface;
  const stages = (state.agency.pipeline.buyer || []);
  const menu = isOpen ? `
    <div class="status-menu${opts.menuUp ? " status-menu--up" : ""}${surface === "row" ? " status-menu--end" : ""}" role="listbox">
      ${stages.map(s => {
        const sc = stageColors(s.id);
        const on = s.id === lead.status;
        return `<button class="status-menu-item${on ? " status-menu-item--on" : ""}"
                        role="option" aria-selected="${on}"
                        data-action="set-status" data-lead-id="${lead.id}" data-status="${s.id}">
          <span class="status-dot" style="background:${sc.fg};"></span>${s.label}${on ? `<span class="status-check">${icon.check()}</span>` : ""}
        </button>`;
      }).join("")}
    </div>` : "";
  return `
    <span class="status-wrap">
      <button class="status-pill" data-action="toggle-status-menu" data-lead-id="${lead.id}" data-surface="${surface}"
              style="background:${c.bg};color:${c.deep};" aria-haspopup="listbox" aria-expanded="${isOpen}"
              title="Changer le statut">
        <span class="status-dot" style="background:${c.fg};"></span>
        <span class="status-pill-label">${label}</span>
        ${icon.chevronDown()}
      </button>
      ${menu}
    </span>`;
}

/* Source icon: compact branded tile. Pure CSS + initial letter — we avoid
   shipping brand SVGs both for trademark hygiene and for a consistent
   visual weight across sources at 18px. */
function renderSourceIcon(source) {
  // Upgraded from text-char to SVG chip (v0.10). Used in drawer header;
  // future Filter popover + re-added table column will reuse this primitive.
  const map = {
    ig:     { title: "Instagram",    iconKey: "instagram" },
    fb:     { title: "Facebook",     iconKey: "facebook"  },
    web:    { title: "Site web",     iconKey: "globe"     },
    email:  { title: "Email",        iconKey: "mail"      },
    manual: { title: "Ajout manuel", iconKey: "userPlus"  },
  };
  const m = map[source] || { title: source || "Inconnu", iconKey: "help" };
  return `<span class="source-chip source-chip--${source}" title="${m.title}" aria-label="Source : ${m.title}">${icon[m.iconKey]()}</span>`;
}

/* Type chip (v0.10.1) — buyer/seller identifier in the drawer header
   chip row. Blue-tinted for Acquéreur, amber-tinted for Vendeur. Uses
   the same type-accent palette family as the Leads page's 4px top
   band, so lead type identity reads consistently across the app. */
function renderTypeChip(type) {
  const label = typeLabel(type);  // "Acquéreur" / "Vendeur"
  return `<span class="type-chip type-chip--${type}">${label}</span>`;
}

/* Verify badge (v0.10.1) — phone-verified quality signal in the drawer
   header. Green pill with checkmark when phoneVerified=true; amber
   pill with warning triangle when false. Inline with the phone number. */
function renderVerifyBadge(verified) {
  if (verified) {
    return `<span class="verify-badge verify-badge--ok">${icon.check()}Vérifié</span>`;
  }
  return `<span class="verify-badge verify-badge--no">${icon.alertTriangle()}Non vérifié</span>`;
}

/* Empty states. kind="no-sellers" when type=seller and no seller leads
   exist at all. kind="no-match" when filter + search returned nothing. */
function renderLeadsEmptyState(kind) {
  if (kind === "no-sellers") {
    return `
      <div class="leads-empty">
        <div class="leads-empty-title">Aucun vendeur pour l'instant</div>
        <div class="leads-empty-body">Les leads vendeurs arrivent via les formulaires Meta marqués « vendeur » ou par ajout manuel. Utilisez le bouton « + » en haut à droite pour saisir un vendeur.</div>
      </div>
    `;
  }
  return `
    <div class="leads-empty">
      <div class="leads-empty-title">Aucun résultat</div>
      <div class="leads-empty-body">Aucun lead ne correspond à ce filtre. Effacez la recherche, déselectionnez l'étape active, ou essayez un autre critère.</div>
    </div>
  `;
}

/* Single table row. Click anywhere on the row opens the drawer for that
   lead — uses the existing open-drawer action. Selected row carries
   data-selected for a subtle highlight. Agent column falls back to an
   em-dash when unassigned; same convention as the Layer 1 card. */
/* Sortable column header. `key` matches the leadComparator switch keys +
   the column width modifier class. Clickable. Displays a tri-state
   indicator: unsorted → muted double-chevron; active asc → arrow up;
   active desc → arrow down. Click cycles desc → asc → unsorted. */
function renderColumnHeader(key, label, colClass) {
  const sort = state.leadsSort;
  const isActive = sort && sort.column === key;
  let indicator;
  if (!isActive) {
    indicator = `<span class="leads-col-sort leads-col-sort--idle">${icon.chevronsUpDown()}</span>`;
  } else if (sort.direction === "desc") {
    indicator = `<span class="leads-col-sort leads-col-sort--active">${icon.arrowDown()}</span>`;
  } else {
    indicator = `<span class="leads-col-sort leads-col-sort--active">${icon.arrowUp()}</span>`;
  }
  return `
    <button class="leads-col ${colClass} leads-col-header"
            data-action="sort-column"
            data-column="${key}"
            aria-sort="${isActive ? sort.direction + "ending" : "none"}">
      <span>${label}</span>${indicator}
    </button>
  `;
}

/* Single table row. In default mode, click = open drawer. In select mode,
   click = toggle selection for that lead (drawer NOT opened). The mode
   branch happens in the click handler, not here — the row always carries
   data-lead-id + a dual-purpose data-action. */
function renderLeadRow(lead) {
  const selected     = state.drawer?.leadId === lead.id;
  const picked       = state.selectedLeadIds.includes(lead.id);
  // V1 table (v0.13.0): Nom · Budget · Secteur · Timing · Statut · Score · Date.
  // Agent column removed (no assignment in V1; assignedAgentId stays for V2).
  // Secteur and Timing are separate columns — never merged (Greg brief §3).
  // Statut is inline-editable via renderStatusCell; Score cycles on click.
  const secteur      = lead.secteur || "—";
  const timing       = timingShort(leadTimeline(lead));
  const checkboxCell = state.selectionMode
    ? `<div class="leads-col leads-col--check"><span class="leads-checkbox ${picked ? "leads-checkbox--on" : ""}" aria-hidden="true">${picked ? icon.check() : ""}</span></div>`
    : "";
  return `
    <div class="leads-row${picked ? " leads-row--picked" : ""}"
         data-action="row-click"
         data-lead-id="${lead.id}"
         data-selected="${selected}"
         role="button" tabindex="0">
      ${checkboxCell}
      <div class="leads-col leads-col--nom">
        ${renderAvatar(lead.initials, lead.tone, 34)}
        <div class="leads-col-nom-text">
          <div class="leads-col-nom-name">${lead.name}</div>
          <div class="leads-col-nom-email">${lead.email}</div>
        </div>
      </div>
      <div class="leads-col leads-col--budget"><span class="budget-tag">${leadPrice(lead)}</span></div>
      <div class="leads-col leads-col--secteur">${secteur}</div>
      <div class="leads-col leads-col--timing">${timing}</div>
      <div class="leads-col leads-col--statut">${renderStatusCell(lead)}</div>
      <div class="leads-col leads-col--score">${renderScoreCell(lead, { surface: "row" })}</div>
      <div class="leads-col leads-col--date">${formatLeadDateHuman(lead.createdAt)}</div>
    </div>
  `;
}

/* DORMANT in V1 (since v0.11.2): renderActivityBadges + the ACTIVITY_* maps
   are no longer called — renderAttributeIcons replaced the mobile badges (the
   action model couldn't be truthful in V1; see V1_SCOPE §2.5). Kept in-file
   for V2 when lead.activity[] returns.
   Activity badges (v0.10.2 update). Returns HTML for the vertical stack
   of outline badges on the mobile card's right side. ALL 4 badges always
   render — done types get the full-stroke treatment, not-yet-done types
   get a muted dashed-border treatment. This gives the agent a glance
   view of the complete touchpoint checklist per lead, not just what's
   been done. Order is fixed: call, email, whatsapp, note.

   v0.10.0 shipped "one badge per distinct type present"; v0.10.2 shifts
   to "always show all 4, with done vs pending visual distinction" per
   spec locked in §10b. Also: badges are slightly smaller than v0.10.1
   to reduce visual weight further. */
const ACTIVITY_ORDER = ["call", "email", "whatsapp", "note"];
const ACTIVITY_ICON  = { call: "phone", email: "mail", whatsapp: "messageCircle", note: "fileText" };
const ACTIVITY_LABEL = { call: "Appelé", email: "Email envoyé", whatsapp: "WhatsApp", note: "Note ajoutée" };
const ACTIVITY_LABEL_PENDING = { call: "Pas encore appelé", email: "Pas encore d'email", whatsapp: "Pas encore de WhatsApp", note: "Pas encore de note" };
function renderActivityBadges(activity) {
  const doneTypes = new Set((activity || []).map(a => a.type));
  return ACTIVITY_ORDER
    .map(t => {
      const done = doneTypes.has(t);
      const label = done ? ACTIVITY_LABEL[t] : ACTIVITY_LABEL_PENDING[t];
      const mod = done ? "activity-badge--done" : "activity-badge--pending";
      return `<span class="activity-badge ${mod}" title="${label}" aria-label="${label}">${icon[ACTIVITY_ICON[t]]()}</span>`;
    })
    .join("");
}

/* Mobile card attribute icons (v0.11.2) — replaces renderActivityBadges in
   V1. Action badges read off the deferred lead.activity[] and couldn't be
   truthful (no send-callback from mailto:/wa.me). These four icons read off
   VERIFIABLE data and light black when true, muted when absent:
     • note present       — lead.notes non-empty
     • phone verified      — lead.phoneVerified
     • contact urgency     — lead.contactPreference === "Tout de suite"
     • specific criteria   — lead.features[] non-empty
   See V1_SCOPE §2.5. renderActivityBadges + activity[] kept dormant for V2. */
function renderAttributeIcons(lead) {
  const attrs = [
    { on: !!(lead.notes && lead.notes.trim()),            iconKey: "fileText", label: "Note présente" },
    { on: !!lead.phoneVerified,                           iconKey: "check",    label: "Téléphone vérifié" },
    { on: lead.contactPreference === "Tout de suite",     iconKey: "bell",     label: "À contacter tout de suite" },
    { on: !!(lead.features && lead.features.length),      iconKey: "star",     label: "Critères spécifiques" },
  ];
  return attrs
    .map(a => `<span class="attr-icon ${a.on ? "attr-icon--on" : "attr-icon--off"}" title="${a.label}" aria-label="${a.label}${a.on ? "" : " : non"}">${icon[a.iconKey]()}</span>`)
    .join("");
}

/* v0.11.5 — mobile-only legend explaining the card attribute icons. Shown as
   the last bloc of the drawer Infos tab on mobile (the icons only appear on
   the mobile card). Mirrors renderAttributeIcons — keep the two in sync. */
function renderIconLegend() {
  const items = [
    { iconKey: "fileText", label: "Une note a été ajoutée" },
    { iconKey: "check",    label: "Téléphone vérifié" },
    { iconKey: "bell",     label: "À contacter tout de suite" },
    { iconKey: "star",     label: "Critères de recherche spécifiques" },
  ];
  return `
    <div class="drawer-section">
      <div class="drawer-section-label">Légende des icônes</div>
      <div class="icon-legend">
        ${items.map(it => `
          <div class="icon-legend-row">
            <span class="attr-icon attr-icon--on">${icon[it.iconKey]()}</span>
            <span class="icon-legend-label">${it.label}</span>
          </div>
        `).join("")}
      </div>
      <p class="icon-legend-hint">Une icône noire = information présente ; grisée = absente.</p>
    </div>`;
}

/* Mobile lead card (v0.10.0) — renders when viewport ≤ 600px (CSS swaps
   which of .leads-table-body / .leads-cards-list is visible).

   Layout (Variant B locked in mockup v5):
   - Avatar vertically centered on the left (40px, content-colored)
   - Content block (flex column) to the right:
       Row 1: name + inline score chip
       Row 2: budget · secteur · timeline
       Row 3: source chip + date + inline Statut pill
   - Attribute-icon stack on the far right — four data-verified icons
     (renderAttributeIcons): note present, phone verified, contact
     "Tout de suite", specific criteria. Replaced the activity-badge
     stack at v0.11.2 (activity[] deferred to V2). v0.13.1: Row 2
     shows secteur, not zone, to match the de-zoned table.

   Same data-action contract as renderLeadRow: click = open drawer in
   default mode, toggle selection in select mode. */
function renderLeadCard(lead) {
  const selected = state.drawer?.leadId === lead.id;
  const picked   = state.selectedLeadIds.includes(lead.id);
  const secteur  = lead.secteur || "—";
  const timeline = leadTimeline(lead);
  const checkbox = state.selectionMode
    ? `<span class="leads-card-checkbox ${picked ? "leads-card-checkbox--on" : ""}" aria-hidden="true">${picked ? icon.check() : ""}</span>`
    : "";
  return `
    <div class="leads-card${picked ? " leads-card--picked" : ""}"
         data-action="row-click"
         data-lead-id="${lead.id}"
         data-selected="${selected}"
         role="button" tabindex="0">
      ${checkbox}
      ${renderAvatar(lead.initials, lead.tone, 40)}
      <div class="leads-card-content">
        <div class="leads-card-row1">
          <div class="leads-card-name">${lead.name}</div>
          ${renderScoreCell(lead, { surface: "row" })}
        </div>
        <div class="leads-card-summary">${leadPrice(lead)} · ${secteur}${timeline ? ` · ${timeline}` : ""}</div>
        <div class="leads-card-meta">
          ${renderSourceIcon(lead.source)}
          <span class="leads-card-date">${formatLeadDate(lead.createdAt, { showYear: false, longMonth: true, showTime: true })}</span>
          ${renderStatusCell(lead)}
        </div>
      </div>
      <div class="leads-card-attrs">${renderAttributeIcons(lead)}</div>
    </div>
  `;
}

/* Bulk action bar: pinned to the bottom of the table card when at least
   one lead is selected. Slides in from below. Actions are stubs for now
   (popovers ship as a follow-up), but the selection semantics are live.

   v0.9.1 — accepts visibleIds (the current filter/search view's lead ids)
   so we can show "X sélectionnés · Y masqués" when some of the selection
   is currently hidden by the active filter. Prevents the "wait, where did
   my selection go?" confusion when a user picks leads, then changes the
   filter, and sees the bar count > visible count. */
function renderBulkActionBar(visibleIds) {
  const n = state.selectedLeadIds.length;
  if (n === 0) return "";
  const hiddenCount = visibleIds
    ? state.selectedLeadIds.filter(id => !visibleIds.includes(id)).length
    : 0;
  const countText = `${n} sélectionné${n === 1 ? "" : "s"}`;
  const hiddenText = hiddenCount > 0
    ? ` · <span class="leads-bulk-bar-hidden">${hiddenCount} masqué${hiddenCount === 1 ? "" : "s"}</span>`
    : "";
  // v0.16 — Statut/Score open popovers above their button (.status-menu/
  // .score-menu reused with the --up modifier). Supprimer is destructive →
  // wired with a native confirm in the handler. Assigner/Archiver dropped:
  // V1 has no agent model (Agent column removed per V1_SCOPE §2.1), and
  // archive duplicates Statut "Perdu" (the off-funnel terminal state).
  // See ADR-0011.
  const statusOpen = state.bulkMenu === "status";
  const scoreOpen  = state.bulkMenu === "score";
  return `
    <div class="leads-bulk-bar" role="region" aria-label="Actions groupées">
      <div class="leads-bulk-bar-count">
        <span class="leads-bulk-bar-dot" aria-hidden="true"></span>
        ${countText}${hiddenText}
      </div>
      <div class="leads-bulk-bar-actions">
        <div class="bulk-menu-wrap">
          <button class="leads-bulk-btn" data-action="toggle-bulk-status-menu"
                  aria-haspopup="listbox" aria-expanded="${statusOpen}">
            ${icon.target()}<span>Statut</span>${icon.chevronDown()}
          </button>
          ${statusOpen ? renderBulkStatusMenu() : ""}
        </div>
        <div class="bulk-menu-wrap">
          <button class="leads-bulk-btn" data-action="toggle-bulk-score-menu"
                  aria-haspopup="listbox" aria-expanded="${scoreOpen}">
            <span class="score-chip-dot score-dot--warm" aria-hidden="true"></span><span>Score</span>${icon.chevronDown()}
          </button>
          ${scoreOpen ? renderBulkScoreMenu() : ""}
        </div>
        <button class="leads-bulk-btn leads-bulk-btn--danger" data-action="bulk-delete">${icon.trash()}<span>Supprimer</span></button>
      </div>
      <button class="leads-bulk-bar-clear" data-action="clear-selection" aria-label="Effacer la sélection">${icon.close()}</button>
    </div>
  `;
}

/* v0.16 — bulk popovers, opened from the bulk action bar's Statut/Score
   buttons. Re-use .status-menu / .score-menu (same visual language as the
   per-lead inline dropdowns) with the --up modifier (bar is at the bottom).
   No "selected" check shown since the action spans multiple leads which may
   currently sit on different values. */
function renderBulkStatusMenu() {
  const stages = state.agency.pipeline.buyer || [];
  return `
    <div class="status-menu status-menu--up" role="listbox" aria-label="Changer le statut">
      ${stages.map(s => {
        const sc = stageColors(s.id);
        return `<button class="status-menu-item"
                        role="option"
                        data-action="bulk-set-status" data-status="${s.id}">
          <span class="status-dot" style="background:${sc.fg};"></span>${s.label}
        </button>`;
      }).join("")}
    </div>`;
}

function renderBulkScoreMenu() {
  const opts3 = [
    { v: "hot",  label: "Chaud",      mod: "hot"  },
    { v: "warm", label: "Tiède",      mod: "warm" },
    { v: "cold", label: "Froid",      mod: "cold" },
    { v: "none", label: "Non évalué", mod: "none" },
  ];
  return `
    <div class="score-menu score-menu--up" role="listbox" aria-label="Changer le score">
      ${opts3.map(o => `<button class="score-menu-item"
                        role="option"
                        data-action="bulk-set-score" data-score="${o.v}">
        <span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}
      </button>`).join("")}
    </div>`;
}

/* v0.15 — Filters panel (Greg brief: filters into V1, BRIEF_STATE §5). A
   dropdown under the Filtrer button with three groups: Statut · Score · Date.
   - Statut: single-select, options Tous + the 4 buyer stages. Drives the SAME
     state.filterTab as the stage cards (one source of truth). "Perdu"/"today"
     aren't offered here — Perdu is terminal, "today" is the quick card + the
     Date "Aujourd'hui" preset.
   - Score: multi-select chips (Chaud/Tiède/Froid/Non évalué) → state.filters.score.
   - Date: single-select presets (Tous/Aujourd'hui/7j/30j/Ce mois) → state.filters.date.
   All of these refine computeLeadsView; pagination then slices the result. */
function renderFilterPanel() {
  const stages = (state.agency.pipeline.buyer || []);
  const fScore = state.filters.score || [];
  const fDate  = state.filters.date || null;

  const statutOpts = [{ id: "all", label: "Tous" }, ...stages.map(s => ({ id: s.id, label: s.label }))];
  const statutHtml = statutOpts.map(o => {
    const on = (o.id === "all") ? !(state.filterTab !== "all" && state.filterTab !== "lost") : state.filterTab === o.id;
    const dot = o.id === "all" ? "" : `<span class="filter-dot" style="background:${stageColors(o.id).fg};"></span>`;
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="set-filter-statut" data-statut="${o.id}">${dot}${o.label}</button>`;
  }).join("");

  const scoreOpts = [
    { v: "hot",  label: "Chaud", mod: "hot"  },
    { v: "warm", label: "Tiède", mod: "warm" },
    { v: "cold", label: "Froid", mod: "cold" },
    { v: "none", label: "Non évalué", mod: "none" },
  ];
  const scoreHtml = scoreOpts.map(o => {
    const on = fScore.includes(o.v);
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="toggle-filter-score" data-score="${o.v}"><span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}${on ? `<span class="filter-check">${icon.check()}</span>` : ""}</button>`;
  }).join("");

  const dateOpts = [
    { v: "all",   label: "Tous" },
    { v: "today", label: "Aujourd'hui" },
    { v: "7d",    label: "7 jours" },
    { v: "30d",   label: "30 jours" },
    { v: "month", label: "Ce mois" },
  ];
  const dateHtml = dateOpts.map(o => {
    const on = (o.v === "all") ? !fDate : fDate === o.v;
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="set-filter-date" data-date="${o.v}">${o.label}</button>`;
  }).join("");

  const anyActive = (state.filterTab !== "all" && state.filterTab !== "lost") || fScore.length || fDate;

  return `
    <div class="leads-filter-panel" role="dialog" aria-label="Filtres">
      <div class="filter-group">
        <div class="filter-group-label">Statut</div>
        <div class="filter-opts">${statutHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Score</div>
        <div class="filter-opts">${scoreHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Date</div>
        <div class="filter-opts">${dateHtml}</div>
      </div>
      <div class="filter-panel-foot">
        <button class="filter-reset${anyActive ? "" : " filter-reset--off"}" data-action="clear-filters"${anyActive ? "" : " disabled"}>Réinitialiser</button>
      </div>
    </div>`;
}

/* v0.15 — pagination bar. Hidden when a single page. Shows the current slice
   range + page navigation. goto-page sets state.leadsPage (handler clamps). */
function renderPagination(page, totalPages, totalVisible, pageStart, pageCount) {
  if (totalPages <= 1) return "";
  const from = pageStart + 1;
  const to   = pageStart + pageCount;
  const prevOff = page <= 1;
  const nextOff = page >= totalPages;
  return `
    <div class="leads-pagination" role="navigation" aria-label="Pagination">
      <span class="leads-pagination-info">${from}–${to} sur ${totalVisible}</span>
      <div class="leads-pagination-controls">
        <button class="leads-pagination-btn leads-pagination-btn--prev" data-action="goto-page" data-page="${page - 1}" ${prevOff ? "disabled" : ""} aria-label="Page précédente">${icon.chevronRight()}</button>
        <span class="leads-pagination-page">Page ${page} / ${totalPages}</span>
        <button class="leads-pagination-btn" data-action="goto-page" data-page="${page + 1}" ${nextOff ? "disabled" : ""} aria-label="Page suivante">${icon.chevronRight()}</button>
      </div>
    </div>`;
}

/* Leads table card: contained Prodex-style card. Header is now minimal —
   just the title "Liste des leads" (no icon, no meta line), search, and
   the two action buttons (Sélectionner / Annuler, then Filtrer). When in
   select mode, the leftmost column becomes a checkbox column — header
   gets a "select all visible" checkbox, rows get per-row checkboxes.
   When selection > 0, a bulk action bar renders at the bottom of the card. */
function renderLeadsTable(view) {
  const totalVisible     = view.visible.length;
  const visibleIds       = view.visible.map(l => l.id);
  // v0.15 — active filter dimensions: Statut (filterTab is a stage/today),
  // Score (set non-empty), Date (preset set). Badge shows how many are on.
  const statutActive     = state.filterTab !== "all" && state.filterTab !== "lost";
  const scoreActive      = (state.filters.score || []).length > 0;
  const dateActive       = !!state.filters.date;
  const activeDims       = (statutActive ? 1 : 0) + (scoreActive ? 1 : 0) + (dateActive ? 1 : 0);
  const filterBadge      = activeDims
    ? `<span class="leads-table-btn-badge">${activeDims}</span>`
    : "";
  // "Select all visible" is on when every visible id is already picked.
  const allVisiblePicked = totalVisible > 0 && visibleIds.every(id => state.selectedLeadIds.includes(id));
  const selectBtnLabel   = state.selectionMode ? "Annuler" : "Sélectionner";
  const selectBtnClass   = state.selectionMode
    ? "leads-table-btn leads-table-btn--active"
    : "leads-table-btn";

  // v0.15 — pagination. Slice the (already filtered/sorted) view into pages of
  // PAGE_SIZE. Clamp the page so a filter that shrinks the set never strands
  // the user on an empty page (state.leadsPage is also reset to 1 on view
  // changes, but clamping makes the render robust regardless).
  const totalPages = Math.max(1, Math.ceil(totalVisible / PAGE_SIZE));
  const page       = Math.min(Math.max(1, state.leadsPage), totalPages);
  const pageStart  = (page - 1) * PAGE_SIZE;
  const pageSlice  = view.visible.slice(pageStart, pageStart + PAGE_SIZE);

  const checkHead = state.selectionMode
    ? `<div class="leads-col leads-col--check leads-col-header leads-col-header--check"
            data-action="toggle-select-all"
            role="columnheader"
            aria-label="Tout sélectionner">
        <span class="leads-checkbox ${allVisiblePicked ? "leads-checkbox--on" : ""}">${allVisiblePicked ? icon.check() : ""}</span>
      </div>`
    : "";

  const noSellers = view.type === "seller" && view.counts.typeCounts.seller === 0;
  const body = noSellers
    ? renderLeadsEmptyState("no-sellers")
    : totalVisible === 0
      ? renderLeadsEmptyState("no-match")
      : `
        <div class="leads-table-head${state.selectionMode ? " leads-table-head--selectable" : ""}" role="row">
          ${checkHead}
          ${renderColumnHeader("name",    "Nom",     "leads-col--nom")}
          ${renderColumnHeader("budget",  "Budget",  "leads-col--budget")}
          ${renderColumnHeader("secteur", "Secteur recherché", "leads-col--secteur")}
          ${renderColumnHeader("timing",  "Timing",  "leads-col--timing")}
          ${renderColumnHeader("statut",  "Statut",  "leads-col--statut")}
          ${renderColumnHeader("score",   "Score",   "leads-col--score")}
          ${renderColumnHeader("date",    "Date",    "leads-col--date")}
        </div>
        <div class="leads-table-body${state.selectionMode ? " leads-table-body--selectable" : ""}" role="rowgroup">
          ${pageSlice.map(renderLeadRow).join("")}
        </div>
        <div class="leads-cards-list${state.selectionMode ? " leads-cards-list--selectable" : ""}" role="list">
          ${pageSlice.map(renderLeadCard).join("")}
        </div>
        ${renderPagination(page, totalPages, totalVisible, pageStart, pageSlice.length)}
      `;

  return `
    <div class="leads-table-card">
      <div class="leads-table-header">
        <div class="leads-table-header-title">
          <span class="leads-table-title">Liste des leads</span>
        </div>
        <div class="leads-table-header-actions">
          ${renderLeadsSearch()}
          <button class="${selectBtnClass}" data-action="toggle-select-mode">
            ${icon.check()}<span>${selectBtnLabel}</span>
          </button>
          <div class="leads-filter-wrap">
            <button class="leads-table-btn${state.filterPanelOpen ? " leads-table-btn--active" : ""}" data-action="toggle-filter-panel" aria-haspopup="true" aria-expanded="${state.filterPanelOpen}" aria-label="Filtrer">
              ${icon.filter()}<span>Filtrer</span>${filterBadge}
            </button>
            ${state.filterPanelOpen ? renderFilterPanel() : ""}
          </div>
        </div>
      </div>
      ${body}
      ${renderBulkActionBar(visibleIds)}
    </div>
  `;
}

/* Leads page composition. Wrapped in a .leads root that carries a
   mode-buyer or mode-seller class — every type-accent CSS rule reads
   from custom properties set by that class, so the whole surface
   re-palettes in one place when the user flips the mode.
   v0.10.3: top chrome replaced (see renderLeadsTitle + renderLeadsModeCard).
   No 4px top band anymore; mode identity carried by the accented
   title word + the accented half of the mode card. */
function renderLeadsContent() {
  const view      = computeLeadsView();
  const modeClass = `mode-${state.leadType}`;
  const typeCount = view.counts.typeCounts[state.leadType];
  return `
    <div class="leads ${modeClass}">
      ${renderLeadsTitle()}
      ${renderLeadsModeCard()}
      <div class="leads-meta-row">
        ${renderLeadsContextChip(state.leadType, typeCount)}
        <span class="leads-updated-meta">Mis à jour il y a 2 min</span>
      </div>
      ${renderLeadsTable(view)}
    </div>
  `;
}

function renderContent() {
  return `
    <main class="content">
      ${renderRouteContent()}
    </main>
  `;
}

function renderRouteContent() {
  if (state.route === "leads") return renderLeadsContent();
  return renderRouteComingSoon();
}

// Reachable in V1 via the "Tableau de bord" nav item (the next page to build);
// the other V2 routes are inert "Bientôt" nav items so they don't land here.
function renderRouteComingSoon() {
  const labels = {
    dashboard: "Tableau de bord",
    agents:    "Agents",
    campaigns: "Campagnes",
    database:  "Database",
    settings:  "Paramètres",
    help:      "Aide",
  };
  const title = labels[state.route] || state.route;
  return `
    <div class="empty-state">
      <div class="empty-state-left">
        <div class="empty-state-title">${title}</div>
        <div class="empty-state-body">Bientôt disponible.</div>
      </div>
      <div class="empty-state-chip">${APP_VERSION}</div>
    </div>
  `;
}

function isMobile() {
  // Matches the breakpoint used in the @media query at the bottom of <style>.
  return window.matchMedia("(max-width: 768px)").matches;
}

/* ── Messages rapides — default templates (v0.11.2) ─────────────────────
   Transcribed VERBATIM from Greg's V1 brief (openhouse_V1_brief.pdf §5).
   Merge fields [Prénom] / [Nom de l'agence] are substituted at tap time by
   mergeTemplate(). Per V1_SCOPE §2.3 there is no in-drawer editor: the
   merged text is handed to the device app (wa.me / mailto:) where the agent
   edits before sending, or copied to clipboard. "Template" is internal-only
   wording — the UI says "Messages rapides". */
const MSG_WHATSAPP =
  "Bonjour [Prénom], nous avons bien reçu votre demande concernant votre recherche immobilière à Paris.\n\n" +
  "Nous avons essayé de vous joindre afin d'échanger sur votre projet et les biens actuellement disponibles.\n\n" +
  "N'hésitez pas à nous rappeler ou à nous répondre directement ici afin que nous puissions en discuter.\n\n" +
  "Bien à vous,\n[Nom de l'agence]";
const MSG_EMAIL_SUBJECT = "Votre recherche immobilière à Paris";
const MSG_EMAIL_BODY =
  "Bonjour [Prénom],\n\n" +
  "Nous avons bien reçu votre demande concernant votre recherche immobilière à Paris.\n\n" +
  "Nous avons essayé de vous joindre afin d'échanger sur votre projet et les biens actuellement disponibles.\n\n" +
  "N'hésitez pas à nous répondre ou à nous rappeler afin que nous puissions en discuter plus en détail.\n\n" +
  "Bien à vous,\n[Nom de l'agence]";

function mergeTemplate(tpl, lead) {
  const prenom = (lead.name || "").trim().split(/\s+/)[0] || "";
  return tpl
    .replace(/\[Prénom\]/g, prenom)
    .replace(/\[Nom de l'agence\]/g, state.agency.name);
}
/* Phone → wa.me digits (E.164 without the +). */
function waDigits(phone) { return (phone || "").replace(/\D/g, ""); }

/* Qualification chips (v0.11.2) — Chaud/Tiède/Froid as coloured selectable
   chips. Writes the SAME lead.score the table cycles + the new score dropdown
   sets (V1_SCOPE §2.3, data-action="set-score").
   DORMANT in V1 (since the drawer redesign): no current call sites — the drawer
   qualification line now uses renderScoreCell (a Score dropdown) to match the
   Statut dropdown. Kept as the chip-style primitive for a re-enabled surface. */
function renderQualChips(lead) {
  const opts = [
    { v: "hot",  label: "Chaud", mod: "hot"  },
    { v: "warm", label: "Tiède", mod: "warm" },
    { v: "cold", label: "Froid", mod: "cold" },
  ];
  return `
    <div class="qual-chips" role="group" aria-label="Qualification rapide">
      ${opts.map(o => `
        <button class="qual-chip qual-chip--${o.mod} ${lead.score === o.v ? "qual-chip--on" : ""}"
                data-action="set-score"
                data-lead-id="${lead.id}"
                data-score="${o.v}"
                aria-pressed="${lead.score === o.v}">
          <span class="qual-chip-dot"></span>${o.label}
        </button>
      `).join("")}
    </div>`;
}

/* Infos tab row helper. */
/* DORMANT in V1 (since v0.13.2): the Budget·Secteur·Timing decision-facts
   strip that used this was dropped from the Infos tab when the Meta form
   record merged in (ADR-0006) — those values now read from the Q&A. Kept as a
   generic label/value row primitive for V2 (the DESIGN_SPEC drawer uses it). */
function drawerInfoRow(label, value) {
  return `
    <div class="drawer-info-row">
      <span class="drawer-info-label">${label}</span>
      <span class="drawer-info-value">${value || "—"}</span>
    </div>`;
}

/* Meta form record (v0.12.0; moved into the Infos tab at v0.13.2, ADR-0006).
   v0.14.0: rendered on a white card (panel + table radius) so the record has
   weight on the grey body. The campaign is the card's head strip (megaphone +
   name) — it titles the card and gives the campaign a job; the Q&A sits in the
   card body, question-above-answer, whitespace between rows, no tags, one
   coherent answer type. SAME data/source of truth. Empty-safe. No data-model
   change. campaign is "" when absent → the head strip is omitted. */
function renderMetaResponses(lead, campaign) {
  const responses = lead.formResponses || [];
  const head = campaign ? `
    <div class="meta-card-head">
      ${icon.megaphone()}
      <span>${campaign}</span>
    </div>` : "";
  const inner = responses.length
    ? `<div class="meta-group">${responses.map(r => `
        <div class="meta-qa">
          <div class="meta-q">${r.question}</div>
          <div class="meta-a">${r.answer || "—"}</div>
        </div>`).join("")}</div>`
    : `<p class="meta-empty">Aucune réponse de formulaire enregistrée pour ce lead.</p>`;
  return `
    <div class="meta-card">
      ${head}
      <div class="meta-card-body">${inner}</div>
    </div>`;
}

function renderDrawer() {
  // Mounted conditionally — only renders the DOM when state.drawer is set.
  // Sliding animation handled by the data-open attribute on the container.
  // v0.11.2 — rebuilt into the "Centre d'action". v0.13.2 — 3 tabs:
  // Infos / Messages rapides / Notes (no Activité). The tabbed structure
  // departs from Greg's "no tabs" brief — Leo's call as product owner
  // (ADR-0003). v0.12.0 split the Meta form record into its own "Réponses
  // Meta" tab (ADR-0004); v0.13.2 folds it back into Infos and drops that
  // tab (ADR-0006), so Infos now holds the verbatim form Q&A + Qualification
  // rapide. v0.14.0 (ADR-0007) locks the drawer IA: header carries identity
  // (avatar + name) and qualification — source · type · Statut · Score on the
  // chip line, Statut and Score as inline dropdowns — plus a titled Contact
  // block; no separator lines. The Infos body is the verbatim Meta record on a
  // white card with the campaign as the card's head strip.
  if (!state.drawer) return "";
  const lead = state.leads.find(l => l.id === state.drawer.leadId);
  if (!lead) return "";
  const VALID_TABS = ["infos", "messages", "notes"];
  const activeTab = VALID_TABS.includes(state.drawer.tab) ? state.drawer.tab : "infos";
  const tabs = [
    { id: "infos",    label: "Infos" },
    { id: "messages", label: "Messages rapides" },
    { id: "notes",    label: "Notes" },
  ];
  const campaign = lead.campaign && lead.campaign !== "—" ? lead.campaign : "";

  // ── Tab bodies ───────────────────────────────────────────────────────
  // Infos: the Meta record on a white card, with the campaign as its head
  // strip. Qualification (Statut + Score) lives in the header. Mobile adds the
  // icon legend below the card.
  const infosBody = `
    ${renderMetaResponses(lead, campaign)}
    ${isMobile() ? renderIconLegend() : ""}`;

  // Messages rapides: 4 actions. Templates merged at render time and handed
  // off to the device app (no in-drawer editor — V1_SCOPE §2.3).
  const waText  = encodeURIComponent(mergeTemplate(MSG_WHATSAPP, lead));
  const mailSub = encodeURIComponent(mergeTemplate(MSG_EMAIL_SUBJECT, lead));
  const mailBody = encodeURIComponent(mergeTemplate(MSG_EMAIL_BODY, lead));
  const copyMsg = encodeURIComponent(mergeTemplate(MSG_WHATSAPP, lead));
  const messagesBody = `
    <div class="msg-actions">
      <a class="msg-btn" href="tel:${lead.phone.replace(/\s/g, "")}">
        ${icon.phone()}<span>Appeler</span>
      </a>
      <a class="msg-btn msg-btn--wa" href="https://wa.me/${waDigits(lead.phone)}?text=${waText}" target="_blank" rel="noopener">
        ${icon.messageCircle()}<span>WhatsApp</span>
      </a>
      <a class="msg-btn" href="mailto:${lead.email}?subject=${mailSub}&body=${mailBody}">
        ${icon.mail()}<span>Email</span>
      </a>
      <button class="msg-btn" data-action="copy-message" data-message="${copyMsg}">
        ${icon.copy()}<span>Copier message</span>
      </button>
    </div>
    <p class="msg-hint">Le message par défaut s'ouvre dans l'application — modifiable avant l'envoi.</p>`;

  // Notes: single plain textarea bound to lead.notes. Saved silently on input
  // (no re-render — full-innerHTML render would drop focus mid-typing).
  const notesBody = `
    <textarea class="notes-field"
              data-notes-lead-id="${lead.id}"
              placeholder="Ex : cherche terrasse · rappeler mardi · veut visiter rapidement">${lead.notes || ""}</textarea>`;

  const bodyByTab = { infos: infosBody, messages: messagesBody, notes: notesBody };

  return `
    <aside class="drawer" data-open="true" role="dialog" aria-label="Centre d'action">
      <div class="drawer-header">
        <div class="drawer-header-top">
          <button class="icon-btn drawer-close" data-action="close-drawer" aria-label="Fermer">
            ${isMobile() ? icon.arrowLeft() : icon.close()}
          </button>
          ${renderAvatar(lead.initials, lead.tone, 40)}
          <div class="drawer-name">${lead.name}</div>
        </div>
        <div class="drawer-header-meta">
          <div class="drawer-chip-row">
            ${renderSourceIcon(lead.source)}
            ${renderTypeChip(lead.type)}
            ${renderStatusCell(lead, { surface: "drawer", menuUp: false })}
            ${renderScoreCell(lead, { surface: "drawer" })}
          </div>
          <div class="drawer-contact-group">
            <div class="drawer-section-label">Contact</div>
            <div class="drawer-contact">
              <a class="drawer-contact-item" href="tel:${lead.phone.replace(/\s/g, "")}">
                ${icon.phone()}
                <span class="drawer-contact-text">${lead.phone}</span>
                ${renderVerifyBadge(lead.phoneVerified)}
              </a>
              <a class="drawer-contact-item drawer-contact-email"
                 data-action="copy-email"
                 data-email="${lead.email}"
                 title="Cliquer pour copier"
                 href="#">
                ${icon.mail()}
                <span class="drawer-contact-text">${lead.email}</span>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="drawer-tabs" role="tablist">
        ${tabs.map(t => `
          <button class="drawer-tab"
                  role="tab"
                  aria-selected="${t.id === activeTab}"
                  data-action="switch-drawer-tab"
                  data-tab="${t.id}">${t.label}</button>
        `).join("")}
      </div>
      <div class="drawer-body" role="tabpanel">
        ${bodyByTab[activeTab]}
      </div>
    </aside>
  `;
}

/* ───── Root render ───── */
function renderApp() {
  return `
    <div class="app-shell">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        ${renderContent()}
      </div>
    </div>
    <div class="mobile-overlay" data-visible="${state.sidebarOpen}"></div>
    ${renderDrawer()}
  `;
}

/* ═══════════════════════════════════════════════════════════════
   RENDER + EVENT DELEGATION
   One render function. One event listener. All interactions route
   through data-action / data-route attributes.
   ═══════════════════════════════════════════════════════════════ */
function render() {
  document.getElementById("app").innerHTML = renderApp();
  // Reflect drawer state on body so mobile CSS can lock scroll.
  document.body.setAttribute("data-drawer-open", state.drawer ? "true" : "false");
  // Reflect active route on body. Used by route-scoped CSS (e.g. topbar
  // search suppression on Leads routes). Kept inside render() so state and
  // DOM stay in sync — same pragmatic pattern as the drawer attr above.
  document.body.setAttribute("data-route", state.route);
  // Sync browser tab title with current route.
  document.title = `${routeTitles[state.route] || "Open House"} · Open House Leads`;
}

document.addEventListener("click", (e) => {
  // Outside-click closes the agency switcher
  if (state.agencySwitcherOpen && !e.target.closest(".agency-switcher-wrap")) {
    setState({ agencySwitcherOpen: false });
    // fall through so other handlers can still react
  }

  // Outside-click closes the user menu
  if (state.userMenuOpen && !e.target.closest(".user-menu-wrap")) {
    setState({ userMenuOpen: false });
  }

  // v0.13.0 — outside-click closes the inline Statut dropdown
  if (state.openStatusMenu != null && !e.target.closest(".status-wrap")) {
    setState({ openStatusMenu: null });
  }

  // outside-click closes the inline Score dropdown
  if (state.openScoreMenu != null && !e.target.closest(".score-wrap")) {
    setState({ openScoreMenu: null });
  }

  // v0.15 — outside-click closes the Filters panel
  if (state.filterPanelOpen && !e.target.closest(".leads-filter-wrap")) {
    setState({ filterPanelOpen: false });
  }

  // v0.16 — outside-click closes the bulk action popovers
  if (state.bulkMenu != null && !e.target.closest(".bulk-menu-wrap")) {
    setState({ bulkMenu: null });
  }

  const target = e.target.closest("[data-action], [data-route]");
  if (!target) return;

  // Nav
  const route = target.getAttribute("data-route");
  if (route) {
    setState({
      route,
      sidebarOpen: false,
      agencySwitcherOpen: false,
      userMenuOpen: false,
      openStatusMenu: null,
      openScoreMenu: null,
    });
    return;
  }

  // Actions
  const action = target.getAttribute("data-action");
  switch (action) {
    case "open-sidebar":
      setState({ sidebarOpen: true });
      break;
    case "toggle-agency-switcher":
      setState({ agencySwitcherOpen: !state.agencySwitcherOpen, userMenuOpen: false });
      break;
    case "toggle-user-menu":
      setState({ userMenuOpen: !state.userMenuOpen, agencySwitcherOpen: false });
      break;
    case "select-city": {
      const cityId = Number(target.getAttribute("data-city-id"));
      setState({
        agency: { ...state.agency, currentCityId: cityId },
        agencySwitcherOpen: false,
      });
      break;
    }
    case "go-profile":
    case "go-preferences":
    case "go-help":
      // Stubs — will route to the right page when those pages exist
      setState({ userMenuOpen: false });
      break;
    case "logout":
      // Stub — real logout posts to /api/auth/logout on the Express backend later
      setState({ userMenuOpen: false });
      break;
    case "add-lead":
      // Stub — opens the "Ajouter un prospect" modal. Form built after Step 2.
      alert("Ajouter un prospect — à venir. Construit après l'étape 2.");
      break;
    case "row-click": {
      const leadId = Number(target.getAttribute("data-lead-id"));
      // In select mode, row click toggles lead selection. Out of select mode,
      // row click opens (or toggles) the drawer. One click target, two modes.
      if (state.selectionMode) {
        const picked = state.selectedLeadIds.includes(leadId);
        const nextIds = picked
          ? state.selectedLeadIds.filter(id => id !== leadId)
          : [...state.selectedLeadIds, leadId];
        setState({ selectedLeadIds: nextIds });
      } else {
        // Same-lead click closes; different-lead click swaps.
        if (state.drawer?.leadId === leadId) setState({ drawer: null });
        else                                 setState({ drawer: { leadId, tab: "infos" } });
      }
      break;
    }
    case "open-drawer": {
      // Legacy alias — kept so any older `data-action="open-drawer"` still works
      // (e.g. future drawer-sourced deep links). Identical to row-click out of
      // select mode. In select mode, never routes here (rows emit row-click).
      const leadId = Number(target.getAttribute("data-lead-id"));
      if (state.drawer?.leadId === leadId) setState({ drawer: null });
      else                                 setState({ drawer: { leadId, tab: "infos" } });
      break;
    }
    case "close-drawer":
      setState({ drawer: null });
      break;
    case "switch-drawer-tab": {
      const tab = target.getAttribute("data-tab");
      setState({ drawer: { ...state.drawer, tab } });
      break;
    }
    case "copy-email": {
      // v0.10.1 — copy-to-clipboard from drawer header email row.
      // Feedback mechanism (toast / inline "Copié" / icon swap) is
      // deferred per §10a — for now, silent success. Preserve default
      // click on older browsers via the href="#" but prevent page jump.
      e.preventDefault();
      const email = target.getAttribute("data-email");
      if (email && navigator.clipboard) {
        navigator.clipboard.writeText(email).catch(() => {
          // Clipboard API can fail on non-HTTPS or permission denial — silently ignore for now.
        });
      }
      break;
    }
    case "set-lead-type": {
      // Toggle Acquéreurs ↔ Vendeurs. Always reset filterTab to "all" — stage
      // ids aren't guaranteed to exist across types (e.g. "visit_planned" is
      // buyer-only), so carrying an active tab across a type flip risks an
      // active filter that matches nothing.
      const typeKey = target.getAttribute("data-type");
      if (typeKey === state.leadType) break;  // no-op if clicking the active tab
      setState({ leadType: typeKey, filterTab: "all", leadsPage: 1 });
      break;
    }
    case "set-filter-tab": {
      const tabId = target.getAttribute("data-tab-id");
      // Clicking the already-active stage card deselects back to "all" —
      // Prodex-style toggle-filter behavior. Other code paths still treat
      // filterTab === "all" as "no stage filter active".
      if (tabId === state.filterTab) setState({ filterTab: "all", leadsPage: 1 });
      else                           setState({ filterTab: tabId, leadsPage: 1 });
      break;
    }
    case "sort-column": {
      // Click cycle on a column header: desc → asc → no sort (back to default id order).
      // First click on any column is always desc because real-estate data is
      // "newest/biggest/hottest first" most of the time.
      const col = target.getAttribute("data-column");
      const curr = state.leadsSort;
      let next;
      if (!curr || curr.column !== col)           next = { column: col, direction: "desc" };
      else if (curr.direction === "desc")         next = { column: col, direction: "asc" };
      else                                         next = null;
      setState({ leadsSort: next, leadsPage: 1 });
      break;
    }
    case "cycle-score": {
      // DORMANT in V1 (since v0.15) — Score is a dropdown now (set-score via
      // renderScoreCell). This click-to-cycle path is unreachable from the UI;
      // kept for reference. Still resets page if ever re-enabled.
      const id = Number(target.getAttribute("data-lead-id"));
      const lead = state.leads.find(l => l.id === id);
      if (lead) {
        const i = SCORE_CYCLE.indexOf(lead.score);
        lead.score = SCORE_CYCLE[(i + 1) % SCORE_CYCLE.length];
        setState({ leadsPage: 1 });  // re-render with mutated lead
      }
      break;
    }
    case "set-score": {
      // Set the score directly to the tapped value from the inline dropdown
      // (table/card + drawer share renderScoreCell). Same lead.score field, so
      // every surface stays in sync. Auto-save, no modal. v0.15: "none" (Non
      // évalué) is a valid, selectable unscored state.
      const id = Number(target.getAttribute("data-lead-id"));
      const score = target.getAttribute("data-score");
      const lead = state.leads.find(l => l.id === id);
      if (lead && SCORE_VALUES.includes(score)) {
        lead.score = score;
        setState({ openScoreMenu: null, leadsPage: 1 });
      }
      break;
    }
    case "toggle-score-menu": {
      // Open/close the inline Score dropdown for this lead+surface. Mirrors
      // toggle-status-menu; the pill is its own [data-action] so a row-click
      // underneath never fires.
      const id = Number(target.getAttribute("data-lead-id"));
      const surface = target.getAttribute("data-surface") || "row";
      const cur = state.openScoreMenu;
      const same = !!cur && cur.id === id && cur.surface === surface;
      setState({ openScoreMenu: same ? null : { id, surface } });
      break;
    }
    case "toggle-status-menu": {
      // v0.13.0 — open/close the inline Statut dropdown for this lead. Toggling
      // the same lead closes it; opening one closes any other. The pill is its
      // own [data-action] so the row's row-click never fires underneath.
      const id = Number(target.getAttribute("data-lead-id"));
      const surface = target.getAttribute("data-surface") || "row";
      const cur = state.openStatusMenu;
      const same = !!cur && cur.id === id && cur.surface === surface;
      setState({ openStatusMenu: same ? null : { id, surface } });
      break;
    }
    case "set-status": {
      // v0.13.0 — pick a stage from the inline dropdown. Sets lead.status
      // directly and closes the menu — auto-save, no modal, no save step
      // (Greg docx brief). Table badge, drawer badge, and filter counts all
      // read lead.status, so they stay in sync on the next render.
      const id = Number(target.getAttribute("data-lead-id"));
      const status = target.getAttribute("data-status");
      const lead = state.leads.find(l => l.id === id);
      const valid = (state.agency.pipeline.buyer || []).some(s => s.id === status);
      if (lead && valid) {
        lead.status = status;
        setState({ openStatusMenu: null, leadsPage: 1 });
      }
      break;
    }
    case "copy-message": {
      // v0.11.2 — Messages rapides "Copier message". Text is stored
      // URI-encoded in the attribute (newlines/quotes safe); decode + copy.
      // Silent success for now (toast feedback deferred, same as copy-email).
      e.preventDefault();
      const raw = target.getAttribute("data-message");
      if (raw && navigator.clipboard) {
        navigator.clipboard.writeText(decodeURIComponent(raw)).catch(() => {});
      }
      break;
    }
    case "seller-soon":
      // V1: Vendeurs half is disabled. Inert by design — no state change.
      break;
    case "toggle-select-mode": {
      // Entering: turn the checkbox column on. Leaving: also clear selection —
      // matches the mental model that "Annuler" means "cancel this operation".
      if (state.selectionMode) {
        setState({ selectionMode: false, selectedLeadIds: [] });
      } else {
        setState({ selectionMode: true });
      }
      break;
    }
    case "toggle-select-all": {
      // Acts on the CURRENTLY VISIBLE rows (the view returned by computeLeadsView).
      // If every visible lead is already picked, deselect them. Otherwise, add
      // any missing ones to the selection. Leads picked-but-hidden stay picked.
      const view = computeLeadsView();
      const visibleIds = view.visible.map(l => l.id);
      const allVisiblePicked = visibleIds.length > 0 && visibleIds.every(id => state.selectedLeadIds.includes(id));
      const nextIds = allVisiblePicked
        ? state.selectedLeadIds.filter(id => !visibleIds.includes(id))
        : [...new Set([...state.selectedLeadIds, ...visibleIds])];
      setState({ selectedLeadIds: nextIds });
      break;
    }
    case "clear-selection":
      // X on the bulk bar. Clears selection but stays in select mode —
      // user can continue picking. Full exit is via the Annuler button / ESC.
      setState({ selectedLeadIds: [] });
      break;
    case "toggle-bulk-status-menu":
      // v0.16 — open/close the Statut popover above the bulk bar. Toggling
      // off the open popover closes both; switching opens the new one.
      setState({ bulkMenu: state.bulkMenu === "status" ? null : "status" });
      break;
    case "toggle-bulk-score-menu":
      setState({ bulkMenu: state.bulkMenu === "score" ? null : "score" });
      break;
    case "bulk-set-status": {
      // v0.16 — apply a Statut to every selected lead at once. Mirrors the
      // single-lead set-status handler (validates against the buyer pipeline,
      // resets to page 1 since the change may filter the visible set). Closes
      // the popover; selection persists so a second action can chain.
      const status = target.getAttribute("data-status");
      const valid = (state.agency.pipeline.buyer || []).some(s => s.id === status);
      if (!valid || state.selectedLeadIds.length === 0) break;
      const ids = new Set(state.selectedLeadIds);
      state.leads.forEach(l => { if (ids.has(l.id)) l.status = status; });
      setState({ bulkMenu: null, leadsPage: 1 });
      break;
    }
    case "bulk-set-score": {
      // v0.16 — apply a Score to every selected lead at once. Same shape as
      // bulk-set-status; "none" (Non évalué) is a real selectable value, so
      // batches can be un-qualified back to grey on purpose.
      const score = target.getAttribute("data-score");
      if (!SCORE_VALUES.includes(score) || state.selectedLeadIds.length === 0) break;
      const ids = new Set(state.selectedLeadIds);
      state.leads.forEach(l => { if (ids.has(l.id)) l.score = score; });
      setState({ bulkMenu: null, leadsPage: 1 });
      break;
    }
    case "bulk-delete": {
      // v0.16 — destructive bulk op: native confirm() guards the action.
      // Selection clears on success (the leads being acted on no longer
      // exist); select mode stays on so the user can continue working.
      const n = state.selectedLeadIds.length;
      if (n === 0) break;
      const msg = `Supprimer ${n} lead${n === 1 ? "" : "s"} ? Cette action est définitive.`;
      if (!window.confirm(msg)) break;
      const ids = new Set(state.selectedLeadIds);
      const nextLeads = state.leads.filter(l => !ids.has(l.id));
      setState({ leads: nextLeads, selectedLeadIds: [], bulkMenu: null, leadsPage: 1 });
      break;
    }
    case "toggle-filter-panel": {
      // v0.15 — open/close the Filters dropdown. Outside-click also closes it
      // (see the .leads-filter-wrap closer in the document click listener).
      setState({ filterPanelOpen: !state.filterPanelOpen });
      break;
    }
    case "set-filter-statut": {
      // v0.15 — Statut is filterTab (shared with the stage cards). "all" clears
      // it; a stage id sets it. Resets to page 1. Panel stays open so the user
      // can set several dimensions in one visit.
      const statut = target.getAttribute("data-statut");
      setState({ filterTab: statut === "all" ? "all" : statut, leadsPage: 1 });
      break;
    }
    case "toggle-filter-score": {
      // v0.15 — Score is multi-select. Toggle the tapped value in/out.
      const v = target.getAttribute("data-score");
      const cur = state.filters.score || [];
      const next = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
      setState({ filters: { ...state.filters, score: next }, leadsPage: 1 });
      break;
    }
    case "set-filter-date": {
      // v0.15 — Date is a single preset. "all" clears it.
      const d = target.getAttribute("data-date");
      setState({ filters: { ...state.filters, date: d === "all" ? null : d }, leadsPage: 1 });
      break;
    }
    case "clear-filters": {
      // v0.15 — reset every filter dimension (Statut/Score/Date) at once.
      setState({ filterTab: "all", filters: { score: [], date: null }, leadsPage: 1 });
      break;
    }
    case "goto-page": {
      // v0.15 — pagination nav. The render clamps to [1, totalPages], so an
      // out-of-range value (disabled button, stale click) self-corrects.
      const p = Number(target.getAttribute("data-page"));
      if (!Number.isNaN(p)) setState({ leadsPage: p });
      break;
    }
    case "filter-search":
      // Bubbled by input events via the delegated input listener below.
      // Mouse-clicking the input field also fires click; ignore here.
      break;
  }
});

// Close mobile sidebar on overlay click
document.addEventListener("click", (e) => {
  if (e.target.classList.contains("mobile-overlay")) {
    setState({ sidebarOpen: false });
  }
});

/* Delegated input listener for the Leads-page search. State drives render,
   so every keystroke re-renders the whole app — including the input. That
   would lose focus and cursor position mid-typing. We capture both before
   setState and restore them after it synchronously rebuilds the DOM. */
document.addEventListener("input", (e) => {
  // v0.11.2 — Notes tab. Save on each keystroke by mutating lead.notes
  // directly, WITHOUT setState/re-render — the app re-renders the whole
  // innerHTML on setState, which would drop the textarea focus mid-typing.
  // The mobile note-present icon refreshes on the next natural render.
  const notesEl = e.target.closest("[data-notes-lead-id]");
  if (notesEl) {
    const id = Number(notesEl.getAttribute("data-notes-lead-id"));
    const lead = state.leads.find(l => l.id === id);
    if (lead) lead.notes = notesEl.value;
    return;
  }

  const target = e.target.closest("[data-action='filter-search']");
  if (!target) return;
  const value     = target.value;
  const cursorPos = target.selectionStart ?? value.length;
  setState({ leadsSearch: value, leadsPage: 1 });
  const next = document.querySelector("[data-action='filter-search']");
  if (next) {
    next.focus();
    try { next.setSelectionRange(cursorPos, cursorPos); } catch (_) { /* no-op on unsupported inputs */ }
  }
});

/* ESC key closes open drawers and dropdowns.
   Priority: drawer > select mode > user menu > agency switcher > sidebar.
   Drawer wins first because it's the most "modal" surface visually. Select
   mode is second because it's a global state the user has actively entered. */
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (state.drawer)              { setState({ drawer: null });             return; }
  if (state.bulkMenu)            { setState({ bulkMenu: null });           return; }
  if (state.filterPanelOpen)     { setState({ filterPanelOpen: false });   return; }
  if (state.selectionMode)       { setState({ selectionMode: false, selectedLeadIds: [] }); return; }
  if (state.userMenuOpen)        { setState({ userMenuOpen: false });      return; }
  if (state.agencySwitcherOpen)  { setState({ agencySwitcherOpen: false });return; }
  if (state.sidebarOpen)         { setState({ sidebarOpen: false });       return; }
});

/* Scroll-aware topbar: add a subtle bottom border once content scrolls under it */
let scrolledState = false;
window.addEventListener("scroll", () => {
  const scrolled = window.scrollY > 4;
  if (scrolled !== scrolledState) {
    scrolledState = scrolled;
    const topbar = document.querySelector(".topbar");
    if (topbar) topbar.setAttribute("data-scrolled", scrolled ? "true" : "false");
  }
}, { passive: true });

/* Re-render across the mobile breakpoint so the drawer close button
   swaps between X (desktop) and back-arrow (mobile) on window resize. */
let wasMobile = isMobile();
window.addEventListener("resize", () => {
  const nowMobile = isMobile();
  if (nowMobile !== wasMobile) {
    wasMobile = nowMobile;
    if (state.drawer) render();
  }
}, { passive: true });

/* Initial render */
render();
</script>

</body>
</html>
