function renderBulkScoreMenu() {
  const opts3 = [
    { v: "hot",  label: "Prioritaire", mod: "hot"  },
    { v: "warm", label: "Intéressant", mod: "warm" },
    { v: "cold", label: "Faible",      mod: "cold" },
    { v: "none", label: "Non évalué",  mod: "none" },
  ];
  return `
    <div class="score-menu" role="listbox" aria-label="Changer le score">
      ${opts3.map(o => `<button class="score-menu-item"
                        role="option"
                        data-action="bulk-set-score" data-score="${o.v}">
        <span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}
      </button>`).join("")}
    </div>`;
}

/* v0.15 — Filters panel (Greg brief: filters into V1, BRIEF_STATE §5). A
   dropdown under the Filtrer button. Groups: Statut · Score · Budget · Secteur ·
   Timing. (v0.18.15, item C: the Date group moved OUT to the control band —
   date scoping now reads state.leadsPeriode, not a panel dimension.)
   - Statut: single-select, options Tous + the 4 buyer stages. Drives the SAME
     state.filterTab as the stage cards (one source of truth). "Perdu" isn't
     offered here — it's terminal.
   - Score: multi-select chips (Prioritaire/Intéressant/Faible/Non évalué) → state.filters.score.
   - Budget · Secteur · Timing: multi-select, values-from-data (ADR-0009).
   All of these refine computeLeadsView; pagination then slices the result. */
function renderFilterPanel() {
  const stages = (state.agency.pipeline.buyer || []);
  const fScore   = state.filters.score   || [];
  const fBudget  = state.filters.budget  || [];
  const fSecteur = state.filters.secteur || [];
  const fTiming  = state.filters.timing  || [];

  const statutOpts = [{ id: "all", label: "Tous" }, ...stages.map(s => ({ id: s.id, label: s.label }))];
  const statutHtml = statutOpts.map(o => {
    const on = (o.id === "all") ? !(state.filterTab !== "all" && state.filterTab !== "lost") : state.filterTab === o.id;
    const dot = o.id === "all" ? "" : `<span class="filter-dot" style="background:${stageColors(o.id).fg};"></span>`;
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="set-filter-statut" data-statut="${o.id}">${dot}${o.label}</button>`;
  }).join("");

  const scoreOpts = [
    { v: "hot",  label: "Prioritaire", mod: "hot"  },
    { v: "warm", label: "Intéressant", mod: "warm" },
    { v: "cold", label: "Faible", mod: "cold" },
    { v: "none", label: "Non évalué", mod: "none" },
  ];
  const scoreHtml = scoreOpts.map(o => {
    const on = fScore.includes(o.v);
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="toggle-filter-score" data-score="${o.v}"><span class="score-chip-dot score-dot--${o.mod}"></span>${o.label}${on ? `<span class="filter-check">${icon.check()}</span>` : ""}</button>`;
  }).join("");

  // v0.18.15 (item C) — the Date dimension left the Filters panel. Date scoping
  // now lives on the top control band (state.leadsPeriode); the panel no longer
  // builds a Date group, the badge no longer counts it, and the old date-filter
  // click handler was removed.

  // v0.18.11 (ADR-0009) — Budget · Secteur · Timing, all multi-select. Option
  // values come FROM the live buyer lead set (values-from-data, ADR-0021's
  // principle), sorted by a known order where one exists, so they always match
  // the seed and a new answer option would appear automatically. data-* carries
  // the raw value (it can contain spaces/accents → encode for the attribute,
  // decode in the handler). v0.18.11 (ADR-0022): derive options from the live
  // non-archived set so the panel doesn't offer a value only an archived lead has.
  const buyers = state.leads.filter(l => l.type === "buyer" && isActive(l));
  const distinct = (pick) => [...new Set(buyers.map(pick).filter(Boolean))];
  const orderBy = (vals, order) => {
    const known = order.filter(o => vals.includes(o));
    const extra = vals.filter(v => !order.includes(v)).sort();
    return [...known, ...extra];
  };

  const budgetVals  = orderBy(distinct(l => l.budget), BUDGET_ORDER);
  const secteurVals = orderBy(distinct(l => l.secteur), KNOWN_ZONES);
  const timingVals  = orderBy(distinct(l => leadTimeline(l)), TIMING_DIST_ORDER);

  const multiHtml = (vals, active, actionVerb, attr, labelFn) => vals.map(v => {
    const on = active.includes(v);
    const label = labelFn ? labelFn(v) : v;
    return `<button class="filter-opt${on ? " filter-opt--on" : ""}" role="option" aria-selected="${on}"
                    data-action="${actionVerb}" data-${attr}="${encodeURIComponent(v)}">${label}${on ? `<span class="filter-check">${icon.check()}</span>` : ""}</button>`;
  }).join("");

  const budgetHtml  = multiHtml(budgetVals,  fBudget,  "toggle-filter-budget",  "budget");
  const secteurHtml = multiHtml(secteurVals, fSecteur, "toggle-filter-secteur", "secteur");
  const timingHtml  = multiHtml(timingVals,  fTiming,  "toggle-filter-timing",  "timing", timingShort);

  const anyActive = (state.filterTab !== "all" && state.filterTab !== "lost")
    || fScore.length || fBudget.length || fSecteur.length || fTiming.length;

  return `
    <div class="leads-filter-panel" role="dialog" aria-label="Filtres">
      <div class="filter-group">
        <div class="filter-group-label">Statut</div>
        <div class="filter-opts">${statutHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Score</div>
        <div class="filter-opts">${scoreHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Budget</div>
        <div class="filter-opts">${budgetHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Secteur</div>
        <div class="filter-opts">${secteurHtml}</div>
      </div>
      <div class="filter-group">
        <div class="filter-group-label">Timing</div>
        <div class="filter-opts">${timingHtml}</div>
      </div>
      <div class="filter-panel-foot">
        <button class="filter-reset${anyActive ? "" : " filter-reset--off"}" data-action="clear-filters"${anyActive ? "" : " disabled"}>Réinitialiser</button>
      </div>
    </div>`;
}

/* v0.15 — pagination bar. Hidden when a single page. Shows the current slice
   range + page navigation. goto-page sets state.leadsPage (handler clamps). */
function renderPagination(page, totalPages, totalVisible, pageStart, pageCount) {
  if (totalPages <= 1) return "";
  const from = pageStart + 1;
  const to   = pageStart + pageCount;
  const prevOff = page <= 1;
  const nextOff = page >= totalPages;
  return `
    <div class="leads-pagination" role="navigation" aria-label="Pagination">
      <span class="leads-pagination-info">${from}–${to} sur ${totalVisible}</span>
      <div class="leads-pagination-controls">
        <button class="leads-pagination-btn leads-pagination-btn--prev" data-action="goto-page" data-page="${page - 1}" ${prevOff ? "disabled" : ""} aria-label="Page précédente">${icon.chevronRight()}</button>
        <span class="leads-pagination-page">Page ${page} / ${totalPages}</span>
        <button class="leads-pagination-btn" data-action="goto-page" data-page="${page + 1}" ${nextOff ? "disabled" : ""} aria-label="Page suivante">${icon.chevronRight()}</button>
      </div>
    </div>`;
}

/* Leads table card: contained Prodex-style card. Header carries search, the
   select toggle (Sélectionner / Annuler with selection count), Filtrer, and —
   when in select mode with ≥1 lead picked — the bulk action buttons (Statut ·
   Score · Supprimer). The "Liste des leads" header title was dropped in
   v0.18.2 (the card is self-evidently the list; topbar already says Leads), so
   the header right-aligns its actions row. Bulk popovers open downward from the
   toolbar (no --up). Sticky-bottom bulk bar removed in v0.16.1; the toolbar
   surface is more discoverable on mobile. */
function renderLeadsTable(view) {
  const totalVisible     = view.visible.length;
  const visibleIds       = view.visible.map(l => l.id);
  // v0.15 — active filter dimensions: Statut (filterTab is a stage/today),
  // Score (set non-empty), Date (preset set). Badge shows how many are on.
  // v0.18.11 (ADR-0009) — Budget · Secteur · Timing join the count.
  const statutActive     = state.filterTab !== "all" && state.filterTab !== "lost";
  const scoreActive      = (state.filters.score   || []).length > 0;
  // v0.18.15 (item C) — date is no longer a panel dimension, so the Filtrer badge
  // does not count it (it's a band control). Same for Campagne.
  const budgetActive     = (state.filters.budget  || []).length > 0;
  const secteurActive    = (state.filters.secteur || []).length > 0;
  const timingActive     = (state.filters.timing  || []).length > 0;
  const activeDims       = (statutActive ? 1 : 0) + (scoreActive ? 1 : 0)
                         + (budgetActive ? 1 : 0) + (secteurActive ? 1 : 0) + (timingActive ? 1 : 0);
  const filterBadge      = activeDims
    ? `<span class="leads-table-btn-badge">${activeDims}</span>`
    : "";
  // "Select all visible" is on when every visible id is already picked.
  const allVisiblePicked = totalVisible > 0 && visibleIds.every(id => state.selectedLeadIds.includes(id));
  // v0.16.1 — Annuler carries the selection count when ≥1 lead is picked.
  // The count is logically tied to the exit-selection control; no separate
  // count chip required after the bottom bar was removed.
  const nSelected        = state.selectedLeadIds.length;
  const selectBtnLabel   = state.selectionMode
    ? (nSelected > 0 ? `Annuler (${nSelected})` : "Annuler")
    : "Sélectionner";
  const selectBtnClass   = state.selectionMode
    ? "leads-table-btn leads-table-btn--active"
    : "leads-table-btn";
  // v0.16.1 — bulk action buttons inline in the toolbar when in select mode
  // with ≥1 selection. Replaces the v0.16.0 sticky-bottom bar (was hard to
  // find on long mobile pages). Popovers open downward (default).
  const showBulk = state.selectionMode && nSelected > 0;
  const statusOpen = state.bulkMenu === "status";
  const scoreOpen  = state.bulkMenu === "score";
  const bulkButtons = showBulk ? `
    <div class="bulk-menu-wrap">
      <button class="leads-table-btn" data-action="toggle-bulk-status-menu"
              aria-haspopup="listbox" aria-expanded="${statusOpen}">
        ${icon.target()}<span>Statut</span>${icon.chevronDown()}
      </button>
      ${statusOpen ? renderBulkStatusMenu() : ""}
    </div>
    <div class="bulk-menu-wrap">
      <button class="leads-table-btn" data-action="toggle-bulk-score-menu"
              aria-haspopup="listbox" aria-expanded="${scoreOpen}">
        <span class="score-chip-dot score-dot--warm" aria-hidden="true"></span><span>Score</span>${icon.chevronDown()}
      </button>
      ${scoreOpen ? renderBulkScoreMenu() : ""}
    </div>
    <button class="leads-table-btn" data-action="bulk-archive">
      ${icon.archive()}<span>Archiver (${nSelected})</span>
    </button>
    <button class="leads-table-btn leads-table-btn--danger" data-action="bulk-delete">
      ${icon.trash()}<span>Supprimer</span>
    </button>
  ` : "";

  // v0.15 — pagination. Slice the (already filtered/sorted) view into pages of
  // PAGE_SIZE. Clamp the page so a filter that shrinks the set never strands
  // the user on an empty page (state.leadsPage is also reset to 1 on view
  // changes, but clamping makes the render robust regardless).
  const totalPages = Math.max(1, Math.ceil(totalVisible / PAGE_SIZE));
  const page       = Math.min(Math.max(1, state.leadsPage), totalPages);
  const pageStart  = (page - 1) * PAGE_SIZE;
  const pageSlice  = view.visible.slice(pageStart, pageStart + PAGE_SIZE);

  const checkHead = state.selectionMode
    ? `<div class="leads-col leads-col--check leads-col-header leads-col-header--check"
            data-action="toggle-select-all"
            role="columnheader"
            aria-label="Tout sélectionner">
        <span class="leads-checkbox ${allVisiblePicked ? "leads-checkbox--on" : ""}">${allVisiblePicked ? icon.check() : ""}</span>
      </div>`
    : "";

  const noSellers = view.type === "seller" && view.counts.typeCounts.seller === 0;
  const body = noSellers
    ? renderLeadsEmptyState("no-sellers")
    : totalVisible === 0
      ? renderLeadsEmptyState("no-match")
      : `
        <div class="leads-table-head${state.selectionMode ? " leads-table-head--selectable" : ""}" role="row">
          ${checkHead}
          ${renderColumnHeader("date",    "Date",    "leads-col--date")}
          ${renderColumnHeader("name",    "Nom",     "leads-col--nom")}
          ${renderColumnHeader("budget",  "Budget",  "leads-col--budget")}
          ${renderColumnHeader("secteur", "Secteur recherché", "leads-col--secteur")}
          ${renderColumnHeader("timing",  "Timing",  "leads-col--timing")}
          ${renderColumnHeader("statut",  "Statut",  "leads-col--statut")}
          ${renderColumnHeader("score",   "Score",   "leads-col--score")}
        </div>
        <div class="leads-table-body${state.selectionMode ? " leads-table-body--selectable" : ""}" role="rowgroup">
          ${pageSlice.map(renderLeadRow).join("")}
        </div>
        <div class="leads-cards-list${state.selectionMode ? " leads-cards-list--selectable" : ""}" role="list">
          ${pageSlice.map(renderLeadCard).join("")}
        </div>
        ${renderPagination(page, totalPages, totalVisible, pageStart, pageSlice.length)}
      `;

  return `
    <div class="leads-table-card">
      <div class="leads-table-header">
        <div class="leads-table-header-actions">
          ${renderLeadsSearch()}
          <button class="${selectBtnClass}" data-action="toggle-select-mode">
            ${icon.check()}<span>${selectBtnLabel}</span>
          </button>
          <div class="leads-filter-wrap">
            <button class="leads-table-btn${state.filterPanelOpen ? " leads-table-btn--active" : ""}" data-action="toggle-filter-panel" aria-haspopup="true" aria-expanded="${state.filterPanelOpen}" aria-label="Filtrer">
              ${icon.filter()}<span>Filtrer</span>${filterBadge}
            </button>
            ${state.filterPanelOpen ? renderFilterPanel() : ""}
          </div>
          <button class="leads-table-btn" data-action="export-csv"${totalVisible === 0 ? " disabled" : ""} aria-label="Exporter en CSV" title="Exporter la vue filtrée (${totalVisible}) en CSV">
            ${icon.download()}<span>Exporter</span>
          </button>
          ${bulkButtons}
        </div>
      </div>
      ${body}
    </div>
  `;
}

/* v0.18.15 — Leads band filters (item A/C). Période + Campagne dropdowns,
   styled identically to the Dashboard's (reuse .dash-filters/.dash-filter).
   - Période is FUNCTIONAL: scopes computeLeadsView by createdAt (item C).
   - Campagne is FUNCTIONAL (resolved post-launch): scopes the list by campaign,
     options counted from the live ACTIVE buyer set. No __demo_non_paris__ here
     (that's a Dashboard-only demo affordance). Both are band controls — they do
     NOT appear in the Filtrer panel or its badge. */
function renderLeadsBandFilters() {
  const periodes = [
    { v: "", label: "Toutes les dates" },
    { v: "today", label: "Aujourd'hui" },
    { v: "7d", label: "7 derniers jours" },
    { v: "30d", label: "30 derniers jours" },
    { v: "month", label: "Ce mois" },
  ];
  const periodeSel = periodes.map(p =>
    `<option value="${p.v}"${(state.leadsPeriode || "") === p.v ? " selected" : ""}>${p.label}</option>`
  ).join("");
  // Campaign options from the live active buyer seed, with counts (mirrors the
  // dashboard's exclude-archived rule so counts match what the list can show).
  const buyers = state.leads.filter(l => l.type === "buyer" && isActive(l));
  const campCounts = {};
  buyers.forEach(l => { if (l.campaign) campCounts[l.campaign] = (campCounts[l.campaign] || 0) + 1; });
  const campOpts = Object.entries(campCounts)
    .sort((a, b) => b[1] - a[1])
    .map(([name, n]) => `<option value="${name}"${state.leadsCampagne === name ? " selected" : ""}>${name} (${n})</option>`)
    .join("");
  return `
    <div class="dash-filters">
      <div class="dash-filter">
        <label for="leads-periode">Période</label>
        <select id="leads-periode" data-action="set-leads-periode">${periodeSel}</select>
      </div>
      <div class="dash-filter">
        <label for="leads-campagne">Campagne</label>
        <select id="leads-campagne" data-action="set-leads-campagne">
          <option value=""${!state.leadsCampagne ? " selected" : ""}>Toutes les campagnes</option>
          ${campOpts}
        </select>
      </div>
    </div>`;
}

/* v0.18.15 — Leads top control band (item A). Pill hard-left (functional here),
   Période + Campagne grouped right. Same rhythm as the Dashboard's dash-head. */
function renderLeadsBand() {
  return `
    <div class="leads-band">
      ${renderLeadsModeCard()}
      ${renderLeadsBandFilters()}
    </div>`;
}

/* Leads page composition. Wrapped in a .leads root that carries a
   mode-buyer or mode-seller class — every type-accent CSS rule reads
   from custom properties set by that class, so the whole surface
   re-palettes in one place when the user flips the mode.
   v0.18.15: top chrome is now the control band (renderLeadsBand): the
   Acquéreurs/Vendeurs pill on the left, Période + Campagne dropdowns on
   the right. The page title + meta-row stay above the band. */
function renderLeadsContent() {
  const view      = computeLeadsView();
  const modeClass = `mode-${state.leadType}`;
  const typeCount = view.counts.typeCounts[state.leadType];
  return `
    <div class="leads ${modeClass}">
      ${renderLeadsBand()}
      <div class="leads-meta-row">
        ${renderLeadsContextChip(state.leadType, typeCount)}
        <span class="leads-updated-meta">Mis à jour il y a 2 min</span>
      </div>
      ${/* DORMANT (v0.18.9, ADR-0020): Vue-rapide chips. Their only triggers were
           the dashboard priority tiles, removed in the 31-05 redirect, so
           state.vueRapide is never populated and this renders "". Call kept so
           the chips light up again with no rewiring if the tiles return (Phase 2). */ ""}
      ${renderVueRapideChips()}
      ${renderLeadsTable(view)}
      ${/* v0.18.15 (item H) — icon legend's home is here, under the table, mobile-only
           (matches current mobile-only row-icon visibility). Moved out of the drawer
           footer so the Archiver/Supprimer buttons anchor at the drawer bottom. */ ""}
      ${isMobile() ? renderIconLegend("table") : ""}
    </div>
  `;
}

/* DORMANT in V1 (v0.18.9, ADR-0020): Vue-rapide chips (ADR-0014). Dismissible
   chips above the table carrying filter state richer than the Filters panel
   (contactPreference, age threshold, campaign). Their only producers were the
   dashboard priority tiles, removed in the 31-05 redirect — so state.vueRapide
   stays empty and this returns "". Kept intact (with its clear-vue-rapide
   handler) for a Phase-2 re-add if the tiles return. */
function renderVueRapideChips() {
  if (!state.vueRapide.length) return "";
  const chips = state.vueRapide.map(v => `
    <span class="vue-rapide-chip">
      <span class="vue-rapide-chip-tag">Vue rapide</span>
      <span class="vue-rapide-chip-label">${v.label}</span>
      <button class="vue-rapide-chip-x" data-action="clear-vue-rapide" data-vr-kind="${v.kind}" aria-label="Retirer ce filtre">${icon.close()}</button>
    </span>`).join("");
  return `<div class="vue-rapide-row">${chips}</div>`;
}

function renderContent() {
  return `
    <main class="content">
      ${renderRouteContent()}
    </main>
  `;
}

const KNOWN_ZONES = ["Rive gauche", "Rive droite centre", "Rive droite ouest"];

/* Zone → arrondissement numbers, from prototype/paris_arrondissements.svg
   (stable ids arr-1..arr-20). Rive droite centre = 1-4, Rive gauche = 5-7,
   Rive droite ouest = 8/16/17. The other 10 stay grey context. */
const ZONE_ARRONDISSEMENTS = {
  "Rive droite centre": [1, 2, 3, 4],
  "Rive gauche":        [5, 6, 7],
  "Rive droite ouest":  [8, 16, 17],
};

/* Three accent-blue tints by zone rank (most → least leads). Neutral/factual
   per ADR-0012 — Bloc 4 carries no semantic colour. */
const ZONE_TINTS = ["#5B6DFF", "#9AA6FF", "#C2C9FF"];
const ZONE_GREY  = "#E6E6EA";

/* Bloc 4 sub-distribution orderings (form-order, per V1_SCOPE §4). */
const BUDGET_ORDER  = ["Moins de 1M", "1M–2M", "2M–4M", "4M+"];
const TIMING_DIST_ORDER = ["Immédiatement", "Dans les 6 prochains mois", "Plus de 6 mois"];
const FEATURE_ORDER = ["Vue dégagée", "Style haussmannien", "Architecture contemporaine signée", "Autre"];
/* v0.18.11 — type-de-projet ordering for the new dashboard breakdown (V1_SCOPE
   §4 question 1: Résidence principale · Pied-à-terre). */
const PROJECT_ORDER = ["Résidence principale", "Pied-à-terre"];

/* Rolling-window count. `days` back from now (inclusive). Used by Bloc 1 KPIs
   and their velocity deltas. Rolling (not calendar) so the headline never
   resets to near-zero on a Monday / the 1st (ADR-0012). */
function countInRollingWindow(leads, days, offsetWindows = 0) {
  const now   = Date.now();
  const span  = days * 24 * 60 * 60 * 1000;
  const end   = now - offsetWindows * span;
  const start = end - span;
  return leads.filter(l => {
    if (!l.createdAt) return false;
    const t = new Date(l.createdAt).getTime();
    return t > start && t <= end;
  }).length;
}

/* DORMANT in V1 (v0.18.9, ADR-0020): velocity delta fed the removed Vue-globale
   KPI pills (31-05 redirect). Kept for a possible Phase-2 re-add.
   Velocity delta: % change of current window vs the equivalent previous one.
   Returns { pct, dir }. dir ∈ "up"|"down"|"flat". null previous (0 leads
   before) → flat with no pct so we don't divide by zero / show +Inf%. */
function velocityDelta(curr, prev) {
  if (prev === 0) return { pct: null, dir: curr > 0 ? "up" : "flat" };
  const change = Math.round(((curr - prev) / prev) * 100);
  return { pct: change, dir: change > 0 ? "up" : change < 0 ? "down" : "flat" };
}

/* Does this lead's createdAt fall within the active dashboard Période?
   Mirrors the Leads Filters panel date math exactly (computeLeadsView) so the
   date language is shared (ADR-0012). null preset = all dates. */
function leadInPeriode(lead, periode) {
  if (!periode) return true;
  if (!lead.createdAt) return false;
  const todayIso = new Date().toISOString().slice(0, 10);
  if (periode === "today") return lead.createdAt.slice(0, 10) === todayIso;
  if (periode === "month")  return lead.createdAt.slice(0, 7) === new Date().toISOString().slice(0, 7);
  const days = periode === "7d" ? 7 : periode === "30d" ? 30 : null;
  if (days == null) return true;
  const floor = new Date();
  floor.setDate(floor.getDate() - days);
  floor.setHours(0, 0, 0, 0);
  return new Date(lead.createdAt) >= floor;
}

const PERIODE_LABELS = {
  null:    "Toutes les dates",
  today:   "Aujourd'hui",
  "7d":    "7 derniers jours",
  "30d":   "30 derniers jours",
  month:   "Ce mois",
};

/* Lead age in whole days from createdAt to now. */
function leadAgeDays(lead) {
  if (!lead.createdAt) return 0;
  return (Date.now() - new Date(lead.createdAt).getTime()) / (24 * 60 * 60 * 1000);
}

/* Aggregate the buyer set into the per-bloc shape the dashboard renders.
   Mirrors computeLeadsView's role. Scoped by Période + Campagne. The non-Paris
   demo campaign swaps in fabricated secteur values so the fallback layout is
   reviewable now (matches the mockup's Campagne switcher). */
function computeDashboardView(periode, campagne) {
  const demoNonParis = campagne === "__demo_non_paris__";

  // Buyer leads only (V1 is buyer-only). Scope by Période + Campagne.
  // v0.18.11 (ADR-0022): archived leads excluded at the base, so every dashboard
  // figure downstream (KPIs, scores, statuts, secteurs, budgets, timing,
  // caractéristiques, type de projet, top-5) drops accordingly — one choke point.
  let leads = state.leads.filter(l => l.type === "buyer" && isActive(l));
  const allBuyers = leads;
  if (!demoNonParis && campagne) leads = leads.filter(l => l.campaign === campagne);
  const scoped = leads.filter(l => leadInPeriode(l, periode));

  const total = scoped.length;

  // ── Header KPIs (v0.18.9, 31-05 redirect, ADR-0020) ──
  // Two non-clickable figures: Leads totaux (scoped total) + Leads ce mois-ci
  // (current calendar month). No rolling windows, no velocity.
  const now = new Date();
  const monthCount = scoped.filter(l => {
    const d = new Date(l.createdAt);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;

  // ── DORMANT (v0.18.9, ADR-0020): rolling-window KPIs + velocity fed the old
  // clickable Vue-globale row, removed in the 31-05 dashboard redirect. Kept
  // computed for a possible Phase-2 re-add (reverses ADR-0012/0015). ──
  const rollingBase = demoNonParis ? allBuyers : leads;
  const week   = countInRollingWindow(rollingBase, 7);
  const weekPrev = countInRollingWindow(rollingBase, 7, 1);
  const month  = countInRollingWindow(rollingBase, 30);
  const monthPrev = countInRollingWindow(rollingBase, 30, 1);

  // ── Bloc 2 — Scores ──
  const scoreCounts = { hot: 0, warm: 0, cold: 0, none: 0 };
  scoped.forEach(l => {
    const s = SCORE_VALUES.includes(l.score) ? l.score : "none";
    scoreCounts[s]++;
  });

  // ── Bloc 3 — Statuts (forward stages + Perdu split) ──
  const statusCounts = { nouveau: 0, a_contacter: 0, contacte: 0, lost: 0 };
  scoped.forEach(l => {
    if (statusCounts[l.status] !== undefined) statusCounts[l.status]++;
  });

  // ── DORMANT (v0.18.9, ADR-0020): the "À traiter en priorité" tiles (ADR-0013)
  // were removed in the 31-05 redirect. Counts kept computed for a possible
  // Phase-2 re-add; AGING_THRESHOLD_DAYS likewise parked DORMANT. ──
  const immediatesUntreated = scoped.filter(l =>
    l.contactPreference === "Tout de suite" && l.status === "nouveau").length;
  const agingNouveau = scoped.filter(l =>
    l.status === "nouveau" && leadAgeDays(l) > AGING_THRESHOLD_DAYS).length;

  // ── Bloc 4 — Réponses Meta Ads ──
  // Secteurs. Paris-mode when every present secteur is a known zone.
  let secteurRows, parisMode;
  if (demoNonParis) {
    parisMode = false;
    secteurRows = [
      { label: "Neuilly", count: 5 },
      { label: "Boulogne-Billancourt", count: 4 },
      { label: "Levallois-Perret", count: 3 },
      { label: "Saint-Cloud", count: 2 },
    ];
  } else {
    const secteurCounts = {};
    scoped.forEach(l => { if (l.secteur) secteurCounts[l.secteur] = (secteurCounts[l.secteur] || 0) + 1; });
    const present = Object.keys(secteurCounts);
    parisMode = present.length > 0 && present.every(s => KNOWN_ZONES.includes(s));
    secteurRows = present
      .map(label => ({ label, count: secteurCounts[label] }))
      .sort((a, b) => b.count - a.count);
  }

  const distOf = (order, pick) => {
    const counts = {};
    order.forEach(k => { counts[k] = 0; });
    scoped.forEach(l => {
      const vals = pick(l);
      (Array.isArray(vals) ? vals : [vals]).forEach(v => {
        if (v == null) return;
        if (counts[v] === undefined) counts[v] = 0;
        counts[v]++;
      });
    });
    return order
      .filter(k => counts[k] !== undefined)
      .map(label => ({ label, count: counts[label] }));
  };

  const budgets  = distOf(BUDGET_ORDER, l => l.budget);
  const timings  = distOf(TIMING_DIST_ORDER, l => leadTimeline(l));
  const features = distOf(FEATURE_ORDER, l => l.features || []);

  // ── v0.18.11 — two new breakdowns (extend the v0.18.9 dashboard relock;
  // count + % of total, same renderDistRow family; CHANGELOG, no ADR). Both
  // read `scoped`, so they inherit Période/Campagne scoping AND (once Item 3
  // lands) the archived exclusion baked into `scoped` — single choke point. ──
  // (a) Type de projet — single-select, 2 buckets (Résidence principale /
  //     Pied-à-terre). PROJECT_ORDER fixes the display order.
  const projectTypes = distOf(PROJECT_ORDER, l => l.projectType);
  // (b) Top-5 caractéristiques — flatten every lead's features[], tally, sort
  //     by count desc; ties broken by FEATURE_ORDER for a stable order; take
  //     the 5 most frequent. Fewer than 5 distinct values → fewer rows (no
  //     padding). Each row's % is "% des leads" (multi-select; a feature held
  //     by half the leads reads ~50%), so the denominator is the scoped total.
  const featTally = {};
  scoped.forEach(l => (l.features || []).forEach(f => { if (f) featTally[f] = (featTally[f] || 0) + 1; }));
  const topFeatures = Object.keys(featTally)
    .map(label => ({ label, count: featTally[label] }))
    .sort((a, b) => (b.count - a.count) || (FEATURE_ORDER.indexOf(a.label) - FEATURE_ORDER.indexOf(b.label)))
    .slice(0, 5);

  return {
    total, monthCount, periode, campagne, demoNonParis,
    bloc1: { week, weekPrev, month, monthPrev },
    scores: scoreCounts,
    statuses: statusCounts,
    priorities: { immediatesUntreated, agingNouveau },
    projectTypes,
    topFeatures,
    meta: { parisMode, secteurRows, budgets, timings, features },
  };
}

/* ── Render primitives ─────────────────────────────────────────── */

/* One horizontal-bar row. `max` scales the fill (relative to the biggest row
   in its group, so a group reads as a comparison). colorHex paints both dot
   and fill; pass dot=false for the factual Bloc-4 groups that don't carry a
   leading dot. v0.18.9 (ADR-0020): pass opts.total to show "count · xx %" of
   the group total alongside the bar. */
function renderDistRow(label, count, max, colorHex, opts = {}) {
  const w = max > 0 ? Math.max(2, Math.round((count / max) * 100)) : 0;
  const dot = opts.dot === false ? "" :
    `<span class="dash-bar-dot" style="background:${colorHex}"></span>`;
  const pct = (opts.total && opts.total > 0)
    ? `<span class="dash-bar-pct">${Math.round((count / opts.total) * 100)}\u00A0%</span>`
    : "";
  return `
    <div class="dash-bar-row${opts.muted ? " dash-bar-row--muted" : ""}">
      <span class="dash-bar-label">${dot}${label}</span>
      <span class="dash-bar-track"><span class="dash-bar-fill" style="width:${w}%;background:${colorHex}"></span></span>
      <span class="dash-bar-val">${count}${pct}</span>
    </div>`;
}

/* Bloc-4 factual group (label above, value top-right, full-width track below).
   Matches the mockup's .b4-col layout. v0.18.9 (ADR-0020): each row shows
   count + % of the group total. `total` defaults to the sum of the group's
   counts (right for single-select groups: budgets, timings); pass an explicit
   total for multi-select groups (features) where rows can exceed lead count. */
function renderDashFactGroup(title, rows, caption = "", total = null) {
  const max = rows.reduce((m, r) => Math.max(m, r.count), 0);
  const denom = total != null ? total : rows.reduce((s, r) => s + r.count, 0);
  const cap = caption
    ? `<span class="dash-fact-multi">${caption}</span>` : "";
  return `
    <div class="dash-fact-col">
      <h4 class="dash-fact-h">${title}${cap}</h4>
      <div class="dash-fact-bars">
        ${rows.map(r => {
          const w = max > 0 ? Math.max(2, Math.round((r.count / max) * 100)) : 0;
          const pct = denom > 0
            ? `<span class="dash-fact-pct">${Math.round((r.count / denom) * 100)}\u00A0%</span>`
            : "";
          return `
            <div class="dash-fact-row">
              <span class="dash-fact-label">${r.label}</span>
              <span class="dash-fact-val">${r.count}${pct}</span>
              <span class="dash-fact-track"><span class="dash-fact-fill" style="width:${w}%"></span></span>
            </div>`;
        }).join("")}
      </div>
    </div>`;
}

function dashDeltaPill(delta) {
  if (delta.pct == null) {
    return `<span class="dash-delta dash-delta--flat">—</span>`;
  }
  const up   = delta.dir === "up";
  const flat = delta.dir === "flat";
  const cls  = flat ? "flat" : up ? "up" : "down";
  const arrow = flat ? ""
    : up
      ? `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9 L9 3"/><path d="M5.5 3 L9 3 L9 6.5"/></svg>`
      : `<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 L9 9"/><path d="M5.5 9 L9 9 L9 5.5"/></svg>`;
  const sign = delta.pct > 0 ? "+" : "";
  return `<span class="dash-delta dash-delta--${cls}">${arrow}${sign}${delta.pct}%</span>`;
}

/* Scores + Statuts side-by-side pair. */
function renderDashScoresStatuts(dv) {
  const sc = dv.scores;
  const scoreMeta = [
    { key: "hot",  label: "Prioritaire", hex: "#E24B4A" },
    { key: "warm", label: "Intéressant", hex: "#F5B94C" },
    { key: "cold", label: "Faible",      hex: "#85B7EB" },
    { key: "none", label: "Non évalué",  hex: "#B6B3AC" },
  ];
  const scoreMax = Math.max(...scoreMeta.map(m => sc[m.key]), 0);

  const st = dv.statuses;
  const stageMeta = [
    { key: "nouveau",       label: "Nouveau",       hex: "#8A8780" },
    { key: "a_contacter",   label: "À contacter",   hex: "#C99A3E" },
    { key: "contacte",      label: "Contacté",      hex: "#6D48DB" },
  ];
  const stageMax = Math.max(...stageMeta.map(m => st[m.key]), st.lost, 0);

  // % of total: scores cover every lead (none = unscored); statuts cover the
  // 3 forward stages + Perdu. Each set sums to the scoped lead count.
  const scoreTotal = scoreMeta.reduce((s, m) => s + sc[m.key], 0);
  const statusTotal = stageMeta.reduce((s, m) => s + st[m.key], 0) + st.lost;

  return `
    <div class="dash-pair">
      <section class="dash-block">
        <div class="dash-block-title">Répartition des scores</div>
        <div class="dash-bars">
          ${scoreMeta.map(m => renderDistRow(m.label, sc[m.key], scoreMax, m.hex, { total: scoreTotal })).join("")}
        </div>
      </section>
      <section class="dash-block">
        <div class="dash-block-title">Répartition des statuts</div>
        <div class="dash-bars">
          ${stageMeta.map(m => renderDistRow(m.label, st[m.key], stageMax, m.hex, { total: statusTotal })).join("")}
        </div>
        <div class="dash-terminal-split">
          ${renderDistRow("Perdu", st.lost, stageMax, "#D98989", { muted: true, total: statusTotal })}
        </div>
      </section>
    </div>`;
}

/* v0.18.11 — two new breakdowns (Type de projet · Top-5 caractéristiques),
   added to the v0.18.9 dashboard relock (ADR-0020 shape: count + % of total,
   renderDistRow family). Same side-by-side dash-pair as Scores/Statuts; reuses
   the existing visual language, no new components. CHANGELOG-tracked (extends
   the dashboard; not an ADR). Both read dv fields fed off computeDashboardView's
   scoped array. */
function renderDashProjectFeatures(dv) {
  const pt = dv.projectTypes;  // [{label,count}] in PROJECT_ORDER
  const ptTotal = pt.reduce((s, r) => s + r.count, 0);
  const ptMax   = pt.reduce((m, r) => Math.max(m, r.count), 0);
  // Two stable tints (neutral accent family — factual, like Bloc 4).
  const ptHex = { "Résidence principale": "#5B6DFF", "Pied-à-terre": "#9AA6FF" };

  const tf = dv.topFeatures;   // up to 5 {label,count}, sorted desc
  const tfMax = tf.reduce((m, r) => Math.max(m, r.count), 0);
  // Multi-select: % of the scoped lead count ("% des leads"), like Bloc 4
  // Caractéristiques — a feature held by half the leads reads ~50%.
  const tfDenom = dv.total;

  const tfBody = tf.length
    ? tf.map(r => renderDistRow(r.label, r.count, tfMax, "#7C5BE0", { total: tfDenom })).join("")
    : `<div class="dash-empty-note">Aucune caractéristique renseignée</div>`;

  return `
    <div class="dash-pair">
      <section class="dash-block">
        <div class="dash-block-title">Type de projet</div>
        <div class="dash-bars">
          ${pt.map(r => renderDistRow(r.label, r.count, ptMax, ptHex[r.label] || "#5B6DFF", { total: ptTotal })).join("")}
        </div>
      </section>
      <section class="dash-block">
        <div class="dash-block-title">Top 5 caractéristiques recherchées
          <span class="dash-hint">plusieurs réponses possibles · % des leads</span>
        </div>
        <div class="dash-bars">
          ${tfBody}
        </div>
      </section>
    </div>`;
}

/* The Paris arrondissement map (Bloc 4 Paris-mode hero). Inlined from
   prototype/paris_arrondissements.svg (viewBox 500×400, ids arr-1..arr-20).
   Arrondissements are painted by their zone's lead-count rank (3 accent-blue
   tints); the 10 uncovered ones stay grey context. Neutral/factual colour. */
function renderParisMap(secteurRows) {
  // Rank present known zones by count → tint index.
  const ranked = secteurRows
    .filter(r => KNOWN_ZONES.includes(r.label))
    .slice()
    .sort((a, b) => b.count - a.count);
  const zoneTint = {};
  ranked.forEach((r, i) => { zoneTint[r.label] = ZONE_TINTS[Math.min(i, ZONE_TINTS.length - 1)]; });
  // arr number → fill
  const arrFill = {};
  Object.entries(ZONE_ARRONDISSEMENTS).forEach(([zone, arrs]) => {
    arrs.forEach(n => { arrFill[n] = zoneTint[zone] || ZONE_GREY; });
  });
  const paths = PARIS_ARR_PATHS.map(p =>
    `<path d="${p.d}" fill="${arrFill[p.n] || ZONE_GREY}"/>`
  ).join("");
  return `
    <svg class="dash-map-svg" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carte des arrondissements ciblés">
      <g stroke="#C9C9CF" stroke-width="1" stroke-linejoin="round">${paths}</g>
      <path fill="#F7F7F3" stroke="#C9C9CF" stroke-width="1" stroke-linejoin="round" d="${PARIS_SEINE_PATH}"/>
    </svg>`;
}

function renderDashMeta(dv) {
  const m = dv.meta;
  const secteurMax = m.secteurRows.reduce((mx, r) => Math.max(mx, r.count), 0);
  // tints for the secteur bars (match the map ranks in Paris-mode)
  const ranked = m.secteurRows.slice().sort((a, b) => b.count - a.count);
  const tintOf = {};
  ranked.forEach((r, i) => { tintOf[r.label] = ZONE_TINTS[Math.min(i, ZONE_TINTS.length - 1)]; });

  const secteurTotal = m.secteurRows.reduce((s, r) => s + r.count, 0);
  const secteurBars = m.secteurRows.map(r =>
    renderDistRow(r.label, r.count, secteurMax, tintOf[r.label] || "#5B6DFF", { total: secteurTotal })
  ).join("");

  const secteurSection = m.parisMode
    ? `
      <div class="dash-sect">
        <div class="dash-map-wrap">
          ${renderParisMap(m.secteurRows)}
          <div class="dash-map-cap">Secteurs ciblés · 10 arrondissements couverts</div>
        </div>
        <div class="dash-sect-bars">
          <h4 class="dash-fact-h">Secteurs recherchés</h4>
          <div class="dash-bars">${secteurBars}</div>
          <div class="dash-map-legend">
            <span class="dash-leg"><span class="dash-sw" style="background:#5B6DFF"></span>Plus de leads</span>
            <span class="dash-leg"><span class="dash-sw" style="background:#C2C9FF"></span>Moins de leads</span>
            <span class="dash-leg"><span class="dash-sw" style="background:#E6E6EA"></span>Hors secteurs ciblés</span>
          </div>
        </div>
      </div>`
    : `
      <div class="dash-sect dash-sect--no-paris">
        <h4 class="dash-fact-h">Autres secteurs
          <span class="dash-fact-multi">la carte Paris s'efface quand les secteurs du formulaire sortent des trois zones connues</span>
        </h4>
        <div class="dash-bars dash-bars--wide">${secteurBars}</div>
      </div>`;

  return `
    <section class="dash-block">
      <div class="dash-block-title">Répartition des réponses Meta Ads</div>
      ${secteurSection}
      <hr class="dash-b4-divider">
      <div class="dash-fact-cols">
        ${renderDashFactGroup("Budgets", m.budgets)}
        ${renderDashFactGroup("Timing projet", m.timings)}
        ${renderDashFactGroup("Caractéristiques", m.features, "plusieurs réponses possibles · % des leads", dv.total)}
      </div>
    </section>`;
}
