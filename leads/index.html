/* ═══════════════════════════════════════════════════════════════
   META FORM RESPONSES (v0.12.0) — the verbatim Lead Ads form record.

   Greg brief Update 26-05: keep every answer the lead gave on the Meta
   form and show it in the drawer so an agent never reopens Meta. The
   drawer "Réponses Meta" tab loops over `lead.formResponses`, an array of
   { question, answer } pairs in form order — the SAME shape the V1 backend
   repository layer (ADR-0001) will produce by mapping Meta's webhook
   `field_data` ([{ name, values }]) → { question, answer }. So the swap
   from dummy → live data is a data-source change only; no render change.

   The normalized fields the table indexes off (budget tag, short secteur
   label, timeline, score) are derived copies and stay as-is; here we
   reconstruct the RAW answer wording the lead actually saw on the form
   (full secteur with arrondissements, "1M à 2M" not the "1M–2M" tag).
   ═══════════════════════════════════════════════════════════════ */

// Short table label → full Meta answer wording (with arrondissements).
const SECTEUR_FULL = {
  "Rive gauche":        "Rive gauche (5e, 6e, 7e)",
  "Rive droite centre": "Rive droite centre (1er, 2e, 3e, 4e)",
  "Rive droite ouest":  "Rive droite ouest (8e, 16e, 17e)",
};
// Budget tag (table) → raw Meta form answer wording.
const BUDGET_META = {
  "Moins de 1M": "Moins de 1M",
  "1M–2M":       "1M à 2M",
  "2M–4M":       "2M à 4M",
  "4M+":         "4M+",
};

// Build the verbatim Q&A record from a buyer lead's normalized fields, in
// Meta form order. Mirrors what the repository layer returns from the API.
function metaResponsesFor(lead) {
  const feats = (lead.features && lead.features.length)
    ? lead.features.join(", ") : "—";
  return [
    { question: "Projet d'acquisition",         answer: lead.projectType || "—" },
    { question: "Secteur recherché",            answer: SECTEUR_FULL[lead.secteur] || lead.secteur || "—" },
    { question: "Caractéristiques spécifiques", answer: feats },
    { question: "Timing projet",                answer: lead.timeline || "—" },
    { question: "Budget",                       answer: BUDGET_META[lead.budget] || lead.budget || "—" },
    { question: "Souhaite être contacté",       answer: lead.contactPreference || "—" },
  ];
}

// Seed dummy buyer leads with the API-shaped record. (Seller leads use a
// different form; they stay dormant in V1 — leadType is locked to "buyer".)
state.leads.forEach(l => {
  if (l.type === "buyer") l.formResponses = metaResponsesFor(l);
});

   Kept here (between state and renderers) so any renderer can use them.
   ═══════════════════════════════════════════════════════════════ */

/* "buyer" → "Acquéreur", "seller" → "Vendeur". Falls back to the raw key. */
function typeLabel(typeKey) {
  return { buyer: "Acquéreur", seller: "Vendeur" }[typeKey] || typeKey;
}

/* Look up a stage label from the agency pipeline. "lost" is a terminal state
   outside the pipeline array — renders as "Perdu". Unknown ids fall back to
   the id itself so missing data is visible rather than silently blank. */
function stageLabel(typeKey, stageId) {
  if (stageId === "lost") return "Perdu";
  const pipeline = state.agency.pipeline[typeKey] || [];
  const stage = pipeline.find(s => s.id === stageId);
  return stage ? stage.label : stageId;
}

/* Stage id → { bg, fg } pill colors. Values chosen to match DESIGN_SPEC §8
   status semantics (new = blue, progress = violet, qualified = green,
   converted = dark green, terminal-fail = red, amber for offer/mandate-signed).
   Buyer and seller stage ids share colors where the semantic matches
   ("contacted" same in both, "converted" ↔ "sold" both dark green, etc.).
   If the status CSS tokens get formalized in :root later, swap hex for var(). */
function stageColors(stageId) {
  // bg   = soft tint (icon badge on default card, card surface on active)
  // fg   = mid-saturation color (icon stroke, active-state label/accent)
  // deep = dark variant for bold text on the tinted surface (active card's count)
  return {
    // Buyer pipeline (v0.13.0 — Greg's 4-stage funnel)
    nouveau:         { bg: "#EEEEF1", fg: "#8A8780", deep: "#4A4843" },  // grey — never treated (Greg brief Update 26-05 (2))
    a_contacter:     { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber — needs a call
    contacte:        { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet — in motion
    visite_prevue:   { bg: "#E4F4E9", fg: "#2F9D6F", deep: "#15653E" },  // green — progressing
    // Legacy buyer ids (dormant — kept so any un-migrated data still colours)
    to_process:      { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue — fresh
    contacted:       { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet — in motion
    qualified:       { bg: "#E4F4E9", fg: "#2F9D6F", deep: "#15653E" },  // green — qualified
    visit_planned:   { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue — progressing
    offer_made:      { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber — committed
    converted:       { bg: "#D8EEDF", fg: "#1F7D54", deep: "#0D5034" },  // dark green — won
    // Seller pipeline (shared where semantically equivalent)
    estimation_sent: { bg: "#EDE7FF", fg: "#6D48DB", deep: "#3E2595" },  // violet
    appointment:     { bg: "#E8ECFF", fg: "#5B6DFF", deep: "#2A3AB8" },  // blue
    mandate_signed:  { bg: "#FBF0DC", fg: "#8C5A08", deep: "#5A3A05" },  // amber
    sold:            { bg: "#D8EEDF", fg: "#1F7D54", deep: "#0D5034" },  // dark green
    // Terminal
    lost:            { bg: "#FDE7E7", fg: "#C44343", deep: "#7A1F1F" },  // red
  }[stageId] || { bg: "#F4F4F6", fg: "#6E6B64", deep: "#3B3A35" };       // fallback = neutral
}

/* Price field differs by type — buyers declare a budget range, sellers
   state an expected price. Both are pre-formatted strings with € suffix. */
function leadPrice(lead) {
  return lead.type === "seller" ? lead.expectedPrice : lead.budget;
}

/* Timeline likewise differs — buyer.timeline is purchase horizon,
   seller.sellingTimeline is listing horizon. */
function leadTimeline(lead) {
  return lead.type === "seller" ? lead.sellingTimeline : lead.timeline;
}

/* French formatter for the ISO createdAt field. Stored ISO (sortable),
   displayed French. When the backend lands and real timestamps come
   in, this is the single function to upgrade (moment/intl).

   v0.10.4 — Path A shipped. createdAt is now a full ISO datetime
   string ("2026-04-18T10:15:00Z" in state). The formatter gained a
   `showTime` opt + a `longMonth` opt so the mobile card can render
   "06 avril · à 16h35" (full month name + middle-dot separator +
   French time style `16h35`) while the desktop table keeps its
   terse "18 avr. 2026" (abbreviated month + year, no time).

   Options:
     - showYear   (default true)   append " 2026"
     - showTime   (default false)  append " · à 16h35"
     - longMonth  (default false)  use "avril" instead of "avr."
   Non-ISO or malformed input falls through as-is so bugs are visible.
*/
const MONTHS_FR_SHORT = ["janv.", "févr.", "mars", "avr.", "mai", "juin",
                         "juil.", "août", "sept.", "oct.", "nov.", "déc."];
const MONTHS_FR_LONG  = ["janvier", "février", "mars", "avril", "mai", "juin",
                         "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
function formatLeadDate(iso, opts) {
  if (!iso) return "—";
  // Accept both date-only "YYYY-MM-DD" and full ISO "YYYY-MM-DDTHH:MM:SSZ".
  // Date portion is always the first 10 chars; the T marker splits off time.
  const datePart = iso.slice(0, 10);
  const [y, m, d] = datePart.split("-").map(Number);
  if (!y || !m || !d) return iso;  // malformed — show raw
  const showYear   = !opts || opts.showYear !== false;
  const showTime   = opts && opts.showTime === true;
  const longMonth  = opts && opts.longMonth === true;
  const monthName  = (longMonth ? MONTHS_FR_LONG : MONTHS_FR_SHORT)[m - 1];
  let out = `${String(d).padStart(2, "0")} ${monthName}`;
  if (showYear) out += ` ${y}`;
  if (showTime && iso.length >= 16 && iso.charAt(10) === "T") {
    // Extract HH:MM from the ISO; render as French-style "16h35".
    const hh = iso.slice(11, 13);
    const mm = iso.slice(14, 16);
    out += ` · à ${hh}h${mm}`;
  }
  return out;
}

/* V1 human date for the table Date column: Aujourd'hui / Hier / Il y a N
   jours for the last week, terse "12 mai" beyond that. Relative to runtime
   (see daysAgoISO on the dummy data). */
function formatLeadDateHuman(iso) {
  if (!iso) return "—";
  const then = new Date(iso);
  if (isNaN(then.getTime())) return iso;
  const now = new Date();
  const d0 = new Date(now.getFullYear(),  now.getMonth(),  now.getDate());
  const d1 = new Date(then.getFullYear(), then.getMonth(), then.getDate());
  const days = Math.round((d0 - d1) / 86400000);
  if (days <= 0)  return "Aujourd'hui";
  if (days === 1) return "Hier";
  if (days < 7)   return `Il y a ${days} jours`;
  return formatLeadDate(iso, { showYear: false });
}

/* Extract numeric budget for sort. budget/expectedPrice are formatted strings
   like "1 200 000 €" — strip non-digits and parse. Missing values sort last
   (returned Infinity in asc, -Infinity conceptually in desc via sign flip).
   Returns 0 if nothing numeric (unset). */
function leadPriceNumeric(lead) {
  const raw = lead.type === "seller" ? lead.expectedPrice : lead.budget;
  if (!raw) return 0;
  const digits = String(raw).replace(/\D/g, "");
  return digits ? parseInt(digits, 10) : 0;
}

/* score sort order: hot > warm > cold (decreasing urgency).
   Unknown scores sort last. */
const SCORE_ORDER = { hot: 3, warm: 2, cold: 1 };
function leadScoreOrder(lead) { return SCORE_ORDER[lead.score] || 0; }
// v0.13.0 — forward order of the 4 buyer stages, + Perdu last. Drives the
// Statut column sort. Stage ids that aren't in the funnel fall back to 0.
const STATUS_ORDER = { nouveau: 1, a_contacter: 2, contacte: 3, visite_prevue: 4, lost: 5 };
function leadStatusOrder(lead) { return STATUS_ORDER[lead.status] || 0; }

/* Agent name lookup for sort. Unassigned leads sort as empty string (top in
   asc, bottom in desc). */
function leadAgentName(lead) {
  if (lead.assignedAgentId == null) return "";
  const agent = state.team.find(t => t.id === lead.assignedAgentId);
  return agent ? agent.name : "";
}

/* Sort comparator factory. Returns a function (a, b) => number per column.
   Direction applied by the caller (multiply result by -1 for desc). */
function leadComparator(column) {
  switch (column) {
    case "name":   return (a, b) => a.name.localeCompare(b.name,   "fr");
    case "budget": return (a, b) => leadPriceNumeric(a) - leadPriceNumeric(b);
    case "secteur":return (a, b) => (a.secteur || "").localeCompare(b.secteur || "", "fr");
    case "timing": return (a, b) => (TIMING_ORDER[leadTimeline(a)] || 0) - (TIMING_ORDER[leadTimeline(b)] || 0);
    case "zone":   return (a, b) => (a.zone || "").localeCompare(b.zone || "", "fr");
    case "score":  return (a, b) => leadScoreOrder(a) - leadScoreOrder(b);
    case "statut": return (a, b) => leadStatusOrder(a) - leadStatusOrder(b);
    case "agent":  return (a, b) => leadAgentName(a).localeCompare(leadAgentName(b), "fr");
    case "date":   return (a, b) => (a.createdAt || "").localeCompare(b.createdAt || "");  // ISO string compare = chronological
    default:       return (a, b) => a.id - b.id;
  }
}

/**
 * Button primitive. Every clickable text-action uses this.
 * Icon-only buttons use `.icon-btn` directly (topbar plus/bell).
 *
 *   variant: "default" | "primary" | "ghost" | "danger"   (default: "default")
 *   size:    "sm" | "md" | "lg"                           (default: "md")
 *   block:   boolean — full-width                         (default: false)
 *   icon:    SVG string (from icon.*()) placed before label
 *   label:   button text
 *   action:  data-action value to dispatch on click
 *   disabled: boolean
 *   extra:   additional class names (rare)
 *
 * DORMANT in V1 (since v0.11.2): no current call sites — the drawer footer
 * (its last consumer) was removed when the Centre d'action moved its actions
 * into the Messages rapides tab. Kept as the generic button primitive for V2
 * forms / re-enabled surfaces. See V1_SCOPE §8 (V2 = re-enable, not rebuild).
 */
function renderButton({ variant = "default", size = "md", block = false, icon = "", label = "", action = "", disabled = false, extra = "" } = {}) {
  const classes = [
    "btn",
    variant !== "default" && `btn--${variant}`,
    size !== "md" && `btn--${size}`,
    block && "btn--block",
    extra,
  ].filter(Boolean).join(" ");
  const attrs = [
    `class="${classes}"`,
    action ? `data-action="${action}"` : "",
    disabled ? `disabled aria-disabled="true"` : "",
  ].filter(Boolean).join(" ");
  return `<button ${attrs}>${icon}${label ? `<span>${label}</span>` : ""}</button>`;
}

/* ───── Leads content (Step 2 Layer 1) ─────
   Route "leads" renders the Leads page. Every primitive below is
   data-driven off state + the helpers defined earlier (stageLabel,
   stageColors, typeLabel, leadPrice, leadTimeline). */

/* Single source of truth for the filtered view. Returns the visible leads
   plus the counts used by the context chip, pipeline bar, and filter tabs.

   Counts discipline:
   - typeCounts    = raw totals per type, ignoring search. Powers the
                     context chip so "10 acquéreurs actifs / 3 vendeurs
                     actifs" reads the honest volume even mid-search.
   - stageCounts   = per-stage counts within current type + search. Powers
                     both the pipeline bar and the filter tabs. Counts stay
                     stable as the user clicks between tabs.
   - lostCount     = same scope as stageCounts but for the terminal "lost".
   - totalFiltered = type + search filtered total; shown in "Tous" tab. */
function computeLeadsView() {
  const type     = state.leadType;
  const pipeline = state.agency.pipeline[type] || [];
  const search   = state.leadsSearch.trim().toLowerCase();

  // Raw per-type totals (ignore search — context chip must read true volume).
  const typeCounts = {
    buyer:  state.leads.filter(l => l.type === "buyer").length,
    seller: state.leads.filter(l => l.type === "seller").length,
  };

  // Apply type + search to get the set all tab/pipeline counts are based on.
  const baseFiltered = state.leads.filter(l => {
    if (l.type !== type) return false;
    if (!search) return true;
    const hay = `${l.name} ${l.email} ${l.zone || ""}`.toLowerCase();
    return hay.includes(search);
  });

  // Count per stage id, plus terminal "lost".
  const stageCounts = {};
  pipeline.forEach(s => { stageCounts[s.id] = 0; });
  let lostCount = 0;
  baseFiltered.forEach(l => {
    if (l.status === "lost") lostCount++;
    else if (stageCounts[l.status] !== undefined) stageCounts[l.status]++;
  });

  // Apply filter tab on top of the base set.
  // Layer 2 note: "all" excludes lost. As of v0.13.0 the Statut column is
  // back, so a lost lead now carries a visible "Perdu" pill when shown.
  // Lost leads are surfaced via the "lost" filter path (a future Filter
  // popover "Afficher les perdus" toggle sets filterTab to "lost"); the
  // code path is kept alive here so that ships without a refactor.
  //
  // v0.9.2 — two new cross-cutting filter values (not stage ids):
  //   "today"      → leads where createdAt === today (any stage, excludes lost)
  //   "unassigned" → leads where assignedAgentId == null (any stage, excludes lost)
  // These filter the visible set just like stage filters, but match by
  // different criteria. computeCrossCuttingCards (used by renderStageCards)
  // computes their counts against leadsInType so the counts don't shift
  // when the user flips between filter tabs.
  const todayIso = new Date().toISOString().slice(0, 10);
  const visible = baseFiltered.filter(l => {
    if (state.filterTab === "all")        return l.status !== "lost";
    if (state.filterTab === "lost")       return l.status === "lost";
    if (state.filterTab === "today")      return l.status !== "lost" && l.createdAt && l.createdAt.slice(0, 10) === todayIso;
    // "unassigned" — DORMANT in V1 (v0.15): the "Non assignés" quick-filter
    // card was removed (brief drops "Non assigné"); no UI sets this value.
    // Kept so any external/legacy state still resolves. assignedAgentId is V2.
    if (state.filterTab === "unassigned") return l.status !== "lost" && l.assignedAgentId == null;
    return l.status === state.filterTab;
  });

  // v0.15 — Filters panel dimensions (Score · Date), layered on top of the
  // filterTab + search base. Statut filtering IS filterTab (shared with the
  // stage cards — one source of truth), so it isn't re-applied here.
  const fScore = state.filters.score || [];
  const fDate  = state.filters.date || null;
  const dateFloor = (() => {
    if (fDate !== "7d" && fDate !== "30d") return null;
    const d = new Date();
    d.setDate(d.getDate() - (fDate === "7d" ? 7 : 30));
    d.setHours(0, 0, 0, 0);
    return d;
  })();
  const monthPrefix = new Date().toISOString().slice(0, 7);  // "YYYY-MM"
  const refined = visible.filter(l => {
    if (fScore.length) {
      const s = SCORE_VALUES.includes(l.score) ? l.score : "none";  // unset/unknown → "none"
      if (!fScore.includes(s)) return false;
    }
    if (fDate) {
      if (!l.createdAt) return false;
      if (fDate === "today")      { if (l.createdAt.slice(0, 10) !== todayIso)     return false; }
      else if (fDate === "month") { if (l.createdAt.slice(0, 7)  !== monthPrefix)  return false; }
      else if (dateFloor)         { if (new Date(l.createdAt) < dateFloor)         return false; }
    }
    return true;
  });

  // Apply column sort. null = default order (by state.leads insertion = by id).
  // Sort happens LAST so filter + search don't depend on sort direction.
  if (state.leadsSort) {
    const cmp = leadComparator(state.leadsSort.column);
    const factor = state.leadsSort.direction === "asc" ? 1 : -1;
    refined.sort((a, b) => cmp(a, b) * factor);
  }

  return {
    visible: refined,
    pipeline,
    type,
    search,
    leadsInType: baseFiltered,  // v0.9.2 — used by cross-cutting KPI card counts
    counts: { stageCounts, lostCount, totalFiltered: baseFiltered.length, typeCounts },
  };
}

/* v0.10.3 — Leads mode card (V11). One card visually split into two

/* Context chip: shows raw active-type count in words. Now lives in

function renderLeadsContextChip(typeKey, count) {

}
